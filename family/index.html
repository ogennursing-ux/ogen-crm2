<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- maximum-scale/user-scalable removed: blocking pinch-zoom fails WCAG 2.2 (1.4.4) and
     hurts anyone who needs to enlarge text — audit remediation, accessibility P1. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2733">
<title>חיבור בקליק — עוגן סיעוד</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-hibur-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/icon-hibur-64.png">
<link rel="apple-touch-icon" href="assets/icon-hibur-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- cloud accounts (cross-device) via Firebase; degrades gracefully to on-device if unavailable -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
/* ============================================================
   חיבור בקליק 2.0 — a real app: accounts, discover, profiles, chat
   ============================================================ */
:root{
  --sea-950:#0A2733; --anchor:#0D4F5C; --sea-500:#2E8CA0; --sea-400:#4FA8BC;
  --mist:#EEF3F4; --paper:#fff; --sand:#E9B44C;
  --like:#12A594; --like-soft:#D6F1ED; --nope:#E5563E; --nope-soft:#FADFD9; --super:#5B8DEF;
  --ink:#12242E; --ink-2:#41565F; --ink-3:#6E8189; --line:#E4ECED;
  --grad-cool:linear-gradient(150deg,#4FA8BC,#0D4F5C);
  --grad-warm:linear-gradient(150deg,#ffb27a,#e5563e);
  --font:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 10px 34px -10px rgba(10,39,51,.22); --shadow-lg:0 28px 64px -14px rgba(10,39,51,.4);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:#0A2733;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
img{display:block;max-width:100%}
.app{width:min(100vw,440px);height:100dvh;max-height:940px;background:var(--mist);position:relative;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
@media(min-width:460px){.app{border-radius:28px;height:min(100dvh,920px)}}

.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--mist)}
.screen.on{display:flex}
.fade{animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- generic ---------- */
.big-btn{width:100%;height:54px;border-radius:16px;background:var(--sand);color:var(--sea-950);font-size:16.5px;font-weight:800;
  box-shadow:0 12px 26px -10px rgba(233,180,76,.55);transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.big-btn:active{transform:scale(.98)}
.big-btn.cool{background:var(--grad-cool);color:#fff;box-shadow:0 12px 26px -10px rgba(13,79,92,.5)}
.big-btn.outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);box-shadow:none}
.big-btn.dark{background:var(--sea-950);color:#fff;box-shadow:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--paper);padding:0 15px;font-size:15px}
.field textarea{height:auto;min-height:70px;padding:12px 15px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sea-400)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:13px;background:var(--paper);border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2);transition:.14s}
.opt.sel{border-color:var(--anchor);background:var(--anchor);color:#fff}
.opt:active{transform:scale(.96)}

/* ---------- auth ---------- */
#welcome{background:radial-gradient(120% 90% at 50% 8%,#12414f,#0A2733);color:#fff;align-items:center;justify-content:center;text-align:center;padding:34px}
/* transparent PNG logo — no opaque backdrop/shadow box (was #000 for the old flat JPEG) */
.mark{width:min(74vw,260px);margin:0 auto 24px;animation:float 3.5s ease-in-out infinite}
.mark img{width:100%;height:auto;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.mark svg{width:50px;height:50px}
#welcome h1{font-size:40px;font-weight:900;letter-spacing:-.02em;margin-bottom:12px}
#welcome h1 span{color:var(--sand)}
#welcome p{color:rgba(255,255,255,.72);font-size:16px;line-height:1.6;max-width:300px;margin-bottom:36px}
.auth-btns{width:min(88vw,340px);display:flex;flex-direction:column;gap:12px}
.auth-head{padding:20px;display:flex;align-items:center;gap:12px}
.auth-head .back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--paper);box-shadow:var(--shadow)}
.auth-head h2{font-size:22px;font-weight:800;color:var(--sea-950)}
.auth-body{flex:1;overflow-y:auto;padding:6px 22px 30px}
.auth-body .intro{color:var(--ink-3);font-size:14px;margin-bottom:20px}
.section-t{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase;margin:20px 0 10px}

/* ---------- app shell ---------- */
.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line);z-index:6}
.top .logo{width:74px;height:34px;overflow:hidden;flex:none}
.top .logo img{width:100%;height:100%;object-fit:contain;display:block}
.top .logo svg{width:19px;height:19px}
.top b{font-size:16px;font-weight:800;color:var(--sea-950)}
.top b span{color:var(--sea-500)}
.top .t-act{margin-inline-start:auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink-3)}
.top .t-act:active{background:var(--mist)}
.tab{flex:1;overflow-y:auto;position:relative}
.tab.pad{padding:16px}

.nav{height:var(--nav-h);flex:none;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:6}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);position:relative}
.nav button svg{width:23px;height:23px}
.nav button span{font-size:10px;font-weight:700}
.nav button.on{color:var(--anchor)}
.nav button .dot{position:absolute;top:8px;inset-inline-end:calc(50% - 16px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--nope);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

/* ---------- discover deck ---------- */
.deck-wrap{position:absolute;inset:0;padding:14px 14px 0;display:flex;flex-direction:column}
.stack{flex:1;position:relative;margin-bottom:6px}
.card{position:absolute;inset:0;border-radius:24px;background:var(--paper);overflow:hidden;box-shadow:var(--shadow);
  will-change:transform;display:flex;flex-direction:column;user-select:none}
.card.top{cursor:grab}
.card .photo{height:56%;position:relative;flex:none;display:grid;place-items:center;overflow:hidden}
.card .photo img{width:100%;height:100%;object-fit:cover}
.card .photo .init{font-size:76px;font-weight:800;color:rgba(255,255,255,.9)}
.card .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.card .vbtn{position:absolute;top:14px;inset-inline-start:14px;width:44px;height:44px;border-radius:50%;
  background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:3;color:#fff}
.card .vbtn svg{width:20px;height:20px;margin-inline-start:2px}
.card .avail{position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.92);color:var(--like);font-size:11.5px;
  font-weight:800;padding:5px 11px;border-radius:20px;display:flex;align-items:center;gap:5px;z-index:3}
.card .avail .d{width:7px;height:7px;border-radius:50%;background:var(--like)}
.card .pdata{position:absolute;bottom:14px;inset-inline-start:16px;inset-inline-end:16px;color:#fff;z-index:3}
.card .pdata h3{font-size:26px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.card .pdata h3 small{font-size:16px;font-weight:600;opacity:.85}
.card .pdata .loc{font-size:14px;opacity:.9;margin-top:2px;display:flex;align-items:center;gap:5px}
.card .pct{position:absolute;top:64px;inset-inline-end:14px;background:#fff;border-radius:14px;padding:6px 10px;text-align:center;z-index:3;box-shadow:var(--shadow)}
.card .pct b{font-size:17px;font-weight:900;color:var(--like);line-height:1;display:block}
.card .pct span{font-size:8px;color:var(--ink-3);font-weight:700}
.card .body{flex:1;padding:14px 18px;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:20px;background:var(--mist);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.chip.good{background:var(--like-soft);color:var(--like)}
.reasons .r{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);margin-bottom:4px}
.reasons .r svg{width:15px;height:15px;color:var(--like);flex:none}
.tap-hint{text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.stamp{position:absolute;top:32px;padding:7px 16px;border-radius:12px;font-size:28px;font-weight:900;border:4px solid;opacity:0;z-index:4;pointer-events:none}
.stamp.like{inset-inline-start:22px;color:var(--like);border-color:var(--like);transform:rotate(-16deg)}
.stamp.nope{inset-inline-end:22px;color:var(--nope);border-color:var(--nope);transform:rotate(16deg)}
.deck-actions{flex:none;display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 0 16px}
.act{width:58px;height:58px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;transition:.14s}
.act:active{transform:scale(.9)} .act svg{width:26px;height:26px}
.act.nope{color:var(--nope)} .act.like{width:70px;height:70px;color:#fff;background:var(--like)} .act.like svg{width:32px;height:32px}
.act.info{color:var(--super);width:48px;height:48px} .act.info svg{width:21px;height:21px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:8px}
.empty .ic{width:74px;height:74px;border-radius:22px;background:var(--grad-cool);display:grid;place-items:center;margin-bottom:6px}
.empty .ic svg{width:36px;height:36px}
.empty h3{font-size:20px;font-weight:800;color:var(--sea-950)}
.empty p{color:var(--ink-3);font-size:14px;max-width:250px}

/* ---------- lists (likes/matches/chat) ---------- */
.list-row{display:flex;align-items:center;gap:13px;background:var(--paper);border-radius:18px;padding:11px;margin-bottom:10px;box-shadow:0 3px 12px rgba(10,39,51,.06)}
.list-row:active{transform:scale(.99)}
.av{width:56px;height:56px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av .on-dot{position:absolute;bottom:2px;inset-inline-end:2px;width:12px;height:12px;border-radius:50%;background:var(--like);border:2px solid #fff}
.list-row .m{flex:1;min-width:0}
.list-row .m b{font-size:16px;font-weight:800;color:var(--sea-950);display:flex;align-items:center;gap:6px}
.list-row .m span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .side{text-align:center;flex:none}
.list-row .side .pc{font-size:17px;font-weight:900;color:var(--like)}
.badge-match{font-size:10px;font-weight:800;color:#fff;background:var(--like);padding:3px 8px;border-radius:20px}
.badge-wait{font-size:10px;font-weight:800;color:#b5701f;background:#FBEBD6;padding:3px 8px;border-radius:20px}
.time{font-size:11px;color:var(--ink-3)}
.list-head{font-size:20px;font-weight:800;color:var(--sea-950);margin:4px 2px 14px}
.list-sub{font-size:13px;color:var(--ink-3);margin:-10px 2px 16px}

/* ---------- profile detail (caregiver) ---------- */
#detail{background:var(--mist)}
.d-hero{height:44%;flex:none;position:relative;display:grid;place-items:center;overflow:hidden}
.d-hero img{width:100%;height:100%;object-fit:cover}
.d-hero .init{font-size:90px;font-weight:800;color:rgba(255,255,255,.9)}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.6))}
.d-back{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(5px);display:grid;place-items:center;color:#fff;z-index:5}
.d-vbtn{position:absolute;top:16px;inset-inline-start:16px;height:42px;padding:0 15px;border-radius:22px;background:rgba(0,0,0,.4);backdrop-filter:blur(5px);display:flex;align-items:center;gap:7px;color:#fff;font-weight:700;font-size:13px;z-index:5}
.d-vbtn svg{width:17px;height:17px}
.d-name{position:absolute;bottom:16px;inset-inline-start:20px;inset-inline-end:20px;color:#fff;z-index:4}
.d-name h2{font-size:30px;font-weight:800;display:flex;align-items:baseline;gap:9px}
.d-name h2 small{font-size:17px;font-weight:600;opacity:.85}
.d-name .loc{font-size:14.5px;opacity:.92;margin-top:3px}
.d-body{flex:1;overflow-y:auto;padding:18px 20px 130px}
.d-pct{display:flex;align-items:center;gap:12px;background:var(--like-soft);border-radius:16px;padding:13px 16px;margin-bottom:18px}
.d-pct .big{font-size:30px;font-weight:900;color:var(--like)}
.d-pct .tx{font-size:13.5px;color:#0c7a6d;font-weight:600;line-height:1.4}
.d-sec{margin-bottom:20px}
.d-sec h4{font-size:13px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-item{background:var(--paper);border-radius:14px;padding:12px 14px}
.d-item .k{font-size:11.5px;color:var(--ink-3);font-weight:600}
.d-item .v{font-size:15px;font-weight:800;color:var(--sea-950);margin-top:2px}
.rec{background:var(--paper);border-radius:14px;padding:13px 15px;margin-bottom:9px;font-size:14px;color:var(--ink-2);line-height:1.5}
.rec .who{font-weight:800;color:var(--sea-950);font-size:13px;margin-bottom:3px}
.rec .stars{color:var(--sand);font-size:13px}
.d-foot{position:absolute;bottom:0;left:0;right:0;padding:14px 20px;background:linear-gradient(transparent,var(--mist) 26%);display:flex;gap:10px}
.d-foot .big-btn{height:52px}
.d-foot .pass{flex:none;width:56px;background:var(--paper);border:1.5px solid var(--line);color:var(--nope);box-shadow:none}

/* ---------- chat thread ---------- */
#chat-thread{background:#e9eef0}
.ct-head{height:60px;flex:none;background:var(--paper);display:flex;align-items:center;gap:11px;padding:0 14px;border-bottom:1px solid var(--line);z-index:5}
.ct-head .back{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.ct-head .av{width:40px;height:40px;border-radius:50%}
.ct-head .who b{font-size:15px;font-weight:800;color:var(--sea-950);display:block}
.ct-head .who span{font-size:11.5px;color:var(--like);font-weight:600}
.ct-head .wa{margin-inline-start:auto;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#25D366}
.ct-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.45;position:relative;animation:fade .18s;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--anchor);color:#fff;border-bottom-left-radius:4px}
.bub.them{align-self:flex-start;background:#fff;color:var(--ink);border-bottom-right-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub time{display:block;font-size:9.5px;opacity:.6;text-align:end;margin-top:3px}
.bub.me .rr{font-size:10px;opacity:.75}
.ct-foot{flex:none;background:var(--paper);padding:10px 12px;display:flex;gap:9px;align-items:center;border-top:1px solid var(--line)}
.ct-foot input{flex:1;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--mist);padding:0 16px;font-size:15px}
.ct-foot input:focus{outline:none;border-color:var(--sea-400)}
.ct-foot .send{width:46px;height:46px;border-radius:50%;background:var(--anchor);color:#fff;display:grid;place-items:center;flex:none}
.ct-foot .send svg{width:20px;height:20px}
.wa-note{text-align:center;font-size:11px;color:var(--ink-3);padding:6px}

/* ---------- profile (self) ---------- */
.p-head{background:var(--grad-cool);color:#fff;padding:26px 20px 22px;text-align:center}
.p-head .pav{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;margin:0 auto 12px;font-size:30px;font-weight:800}
.p-head h2{font-size:22px;font-weight:800}
.p-head span{opacity:.8;font-size:13.5px}
.p-stats{display:flex;gap:10px;padding:16px;margin-top:-2px}
.p-stat{flex:1;background:var(--paper);border-radius:16px;padding:14px;text-align:center;box-shadow:0 3px 12px rgba(10,39,51,.06)}
.p-stat b{font-size:24px;font-weight:900;color:var(--anchor);display:block}
.p-stat span{font-size:11.5px;color:var(--ink-3);font-weight:600}

/* modal / toast */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(10,39,51,.55);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s}
.modal{width:100%;max-width:360px;background:var(--paper);border-radius:22px;padding:22px;text-align:center;box-shadow:var(--shadow-lg)}
.modal .mi{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px}
.modal h3{font-size:21px;font-weight:800;color:var(--sea-950);margin-bottom:6px}
.modal p{font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:18px}
#toast{position:absolute;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(16px);opacity:0;
  background:var(--sea-950);color:#fff;padding:11px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:50;transition:.25s;box-shadow:var(--shadow);white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.match-anim{animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== WELCOME ===== -->
  <section class="screen on" id="welcome">
    <div class="mark"><img src="assets/logo-hibur.png" alt="חיבור בקליק"></div>
    <p>המטפל/ת המושלם/ת עבור יקירכם — בהחלקה אחת.</p>
    <div class="auth-btns">
      <button class="big-btn" onclick="go('signup')">הרשמה חדשה</button>
      <button class="big-btn outline" onclick="go('login')">כבר יש לי חשבון — כניסה</button>
    </div>
  </section>

  <!-- ===== SIGNUP ===== -->
  <section class="screen" id="signup">
    <div class="auth-head"><button class="back" onclick="go('welcome')">→</button><h2>הרשמה</h2></div>
    <div class="auth-body">
      <div class="intro">פותחים חשבון פעם אחת — וממשיכים מאיפה שהפסקתם, בכל כניסה.</div>
      <div class="field"><label>שם איש/אשת הקשר</label><input id="su-name" placeholder="למשל: מיכל כהן"></div>
      <div class="field"><label>תעודת זהות</label><input id="su-id" inputmode="numeric" placeholder="9 ספרות"></div>
      <div class="field"><label>טלפון</label><input id="su-phone" inputmode="tel" placeholder="050-0000000"></div>
      <div class="field"><label>דוא"ל</label><input id="su-email" type="email" placeholder="name@example.com" dir="ltr" style="text-align:right"></div>

function scoreMatch(lead,w){
  if(lead.gender&&w.gender&&lead.gender!==w.gender)return null;
  if(lead.needsHoist==="yes"&&w.canHoist==="no")return null;
  if(lead.needsDiapers==="yes"&&w.canDiapers==="no")return null;
  if(lead.hasDementia==="yes"&&w.knowsDementia==="no")return null;
  let score=0;const reasons=[];const add=(p,l)=>{score+=p;reasons.push(l);};
  if(lead.gender&&w.gender&&lead.gender===w.gender)add(30,lead.gender==="female"?"מטפלת (כבקשתכם)":"מטפל (כבקשתכם)");
  if(lead.city&&w.city&&(w.city.includes(lead.city)||lead.city.includes(w.city)))add(40,"באזור שלכם — "+w.city);
  if(w.languages&&lead.requirements){const L=w.languages.split(/[,\s]+/).filter(Boolean);if(L.some(x=>lead.requirements.includes(x)))add(15,"דובר/ת "+lead.requirements);}
  if(lead.offeredSalary&&w.expectedSalary){const g=Math.abs(+lead.offeredSalary-+w.expectedSalary);
    if(g<=300)add(24,"מתאים לתקציב שלכם");else if(g<=800)add(18,"קרוב לתקציב שלכם");else if(g<=1500)add(5,"בטווח התקציב");}
  if(lead.needsHoist==="yes"&&w.canHoist==="yes")add(25,"מיומן/ת בהרמה ומנוף");
  if(lead.hasDementia==="yes"&&w.knowsDementia==="yes")add(25,"ניסיון עם דמנציה/אלצהיימר");
  if(lead.needsDiapers==="yes"&&w.canDiapers==="yes")add(15,"טיפול אישי מלא");
  if(w.status==="זמין")add(10,"פנוי/ה להתחיל");
  return {score,reasons};
}

const ROUND_SIZE=5;

   displayed match% always stays the true, unboosted score, only the ORDER shifts. */
const FAIRNESS_WINDOW_DAYS=14, FAIRNESS_BOOST=8;
function isRecentCaregiver(w){
  const t=w.createdAt||w.dateAdded; if(!t)return false;
  return (Date.now()-new Date(t).getTime())/864e5<=FAIRNESS_WINDOW_DAYS;

function buildDeck(){
  const scored=[];

    if(me.liked.includes(w.id)||me.passed.includes(w.id))return; // already decided

  });

  deckAll=scored; // remaining undecided pool, sorted — shrinks as candidates get decided

  deckIdx=0;

/* drag */
function bindDrag(card){
  if(!card)return;let sx,sy,dx=0,drag=false;
  const start=e=>{drag=true;card.style.transition="none";const p=pt(e);sx=p.x;sy=p.y;};
  const move=e=>{if(!drag)return;const p=pt(e);dx=p.x-sx;const dy=p.y-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/16}deg)`;
    const lk=$(".stamp.like",card),np=$(".stamp.nope",card);
    if(lk)lk.style.opacity=Math.max(0,Math.min(1,dx/90));if(np)np.style.opacity=Math.max(0,Math.min(1,-dx/90));
    if(Math.abs(dx)>6&&e.cancelable)e.preventDefault();};
  const end=()=>{if(!drag)return;drag=false;card.style.transition="transform .3s cubic-bezier(.2,.8,.2,1)";
    if(dx>95){fling(card,1);decide("like");}else if(dx<-95){fling(card,-1);decide("nope");}
    else{card.style.transform="";$$(".stamp",card).forEach(s=>s.style.opacity=0);}dx=0;};
  card.addEventListener("pointerdown",start);window.addEventListener("pointermove",move,{passive:false});window.addEventListener("pointerup",end);
}

/* ---------- Gemini AI — authenticated server proxy (audit remediation Phase 5) ----------
   Used to call Gemini directly from the browser with a personal key pasted into Settings
   and stored in localStorage — the key never needs to reach the browser now, and every
   call requires the user's real signed-in session instead of just a client-visible key. */
const AI_PROXY_URL="https://hibur-wa-bridge.netlify.app/.netlify/functions/ai-proxy";
const hasAI=()=>!!(firebase.auth&&firebase.auth().currentUser);
async function callAI(prompt,system,media){
  const user=firebase.auth().currentUser; if(!user)throw new Error("no-auth");
  const idToken=await user.getIdToken();
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
  const r=await fetch(AI_PROXY_URL,{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},
    body:JSON.stringify({prompt,system,media}),signal:ctrl.signal});
  clearTimeout(to);
  const d=await r.json();
  if(!r.ok||d.error||typeof d.text!=="string")throw new Error("AI "+(d.error||r.status));
  return d.text.trim();
}
async function translateMsg(text,targetLang){
  if(!hasAI()||!text.trim())return null;
  try{return await callAI(text,`Translate the user's message into ${targetLang}. Reply with ONLY the translation, nothing else — no quotes, no explanation, no original text.`);}
  catch(e){console.warn("translate",e);return null;}
}
async function explainMatchAI(lead,reasons){
  if(!hasAI())return null;
  try{
    return await callAI(
      `פרטי המשפחה: מחפשים ${lead.gender==="female"?"מטפלת":lead.gender==="male"?"מטפל":"מטפל/ת"} ב${lead.city||"—"}, תקציב ${lead.offeredSalary||"—"} ש"ח.\n`+
      `סיבות התאמה טכניות: ${reasons.join(", ")}.\n\nכתוב/כתבי משפט או שניים חמים וטבעיים בעברית שמסבירים למשפחה למה זו התאמה טובה, בגוף שני רבים ("לכם"). בלי כותרות, בלי רשימה.`,
      "את/ה עוזר/ת ידידותי לאפליקציית התאמת מטפלים. תשובה קצרה, חמה, טבעית — לא רשימה טכנית."

// A like was fire-and-forget: the card gets swiped away and locally marked liked
// regardless of whether the Firestore write actually lands. Offline (or a transient
// error), the write silently never happened — the caregiver was never notified and no
// match could ever form, with no sign anything went wrong. Failed writes now queue for
// retry (on reconnect and on next app open) instead of being dropped.
const PENDING_LIKES_KEY="hb_pendingLikes";
function loadPendingLikes(){try{return JSON.parse(localStorage.getItem(PENDING_LIKES_KEY)||"[]");}catch(e){return [];}}
function savePendingLikes(list){try{localStorage.setItem(PENDING_LIKES_KEY,JSON.stringify(list));}catch(e){}}
function familyLikePayload(w){
  return {famId:me.id,cgId:w.id,
    fam:{name:me.name,city:me.city,phone:me.phone||"",gender:me.family.gender,budget:me.family.offeredSalary,
      needHoist:me.family.needsHoist,needDementia:me.family.hasDementia,needDiapers:me.family.needsDiapers,req:me.family.requirements},
    cg:{name:w.name,lastName:w.lastName||"",city:w.city||"",nationality:w.nationality||"",photo:w.photo||"",age:w.age||"",phone:w.phone||""},
    famLiked:true,updatedAt:now()};
}
function familyLike(w){
  // Demo/example caregivers (placeholder deck when no real caregivers exist yet) must never
  // create a real hibur_conn document — that polluted the shared collection with demo_* docs
  // no caregiver ever receives.
  if(String(w.id||"").startsWith("demo_"))return;
  if(!connCol()){queuePendingLike(w);return;}
  connCol().doc(me.id+"__"+w.id).set(familyLikePayload(w),{merge:true})
    .catch(e=>{console.warn("like",e);queuePendingLike(w);});
}
function queuePendingLike(w){
  const list=loadPendingLikes();
  if(!list.some(x=>x.cgId===w.id&&x.famId===me.id))list.push({famId:me.id,cgId:w.id,w});
  savePendingLikes(list);
}
async function retryPendingLikes(){
  if(!connCol())return;
  const list=loadPendingLikes(); if(!list.length)return;
  const remaining=[];
  for(const item of list){
    if(item.famId!==me.id){remaining.push(item);continue;} // belongs to a different signed-in account
    if(String(item.cgId||"").startsWith("demo_"))continue;  // drop any demo like queued by an older build
    try{await connCol().doc(item.famId+"__"+item.cgId).set(familyLikePayload(item.w),{merge:true});}
    catch(e){remaining.push(item);}
  }
  savePendingLikes(remaining);
}

}

  const w=cgById(chatId)||c.cg||{name:"מטפל/ת"};
  const msg={from:"fam",text:t,clientAt:now()};
  const targetLang=guessNonHebrewLang(w);
  if(targetLang){const tr=await translateMsg(t,targetLang);if(tr){msg.translated=tr;msg.translatedLang=targetLang;}}
  // Write the message to the subcollection (server-timestamped) and bump the parent summary.
  // The open-chat listener re-renders from the subcollection, so no optimistic local append.
  try{
    await msgsCol(c._id).add(Object.assign({},msg,{at:SVT()}));
    await connCol().doc(c._id).set({lastText:t,lastFrom:"fam",lastAt:now(),msgCount:INC(1),updatedAt:now()},{merge:true});
    readAt[c._id]=now();
  }catch(e){ console.warn(e); toast("ההודעה לא נשלחה — נסו שוב","err"); inp.value=t; return; }
  const waPhone=(c.cg&&c.cg.phone)||w.phone; if(waPhone)bridgeToWhatsapp(waPhone,msg.translated||t,c._id);
}

      <div class="field"><label>עיר</label><select id="pf-city">${CITIES.map(c=>`<option ${me.city===c?"selected":""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label>מטפל/ת מבוקש/ת</label><select id="pf-gender">
        <option value="female" ${f.gender==="female"?"selected":""}>מטפלת</option>
        <option value="male" ${f.gender==="male"?"selected":""}>מטפל</option>
        <option value="" ${!f.gender?"selected":""}>לא משנה</option>
      </select></div>
      <div class="field"><label>שפה מועדפת</label><select id="pf-lang">
        ${["עברית","אנגלית","רוסית"].map(l=>`<option ${f.requirements===l?"selected":""}>${l}</option>`).join("")}
        <option value="" ${!f.requirements?"selected":""}>לא משנה</option>
      </select></div>
      <div class="field"><label>צרכי טיפול</label>
        <label style="display:flex;align-items:center;gap:9px;margin-bottom:8px;cursor:pointer;font-size:14px"><input type="checkbox" id="pf-hoist" ${f.needsHoist==="yes"?"checked":""} style="width:18px;height:18px;accent-color:var(--anchor)"> מנוף / הרמה</label>
        <label style="display:flex;align-items:center;gap:9px;margin-bottom:8px;cursor:pointer;font-size:14px"><input type="checkbox" id="pf-diapers" ${f.needsDiapers==="yes"?"checked":""} style="width:18px;height:18px;accent-color:var(--anchor)"> טיפול אישי (חיתולים)</label>
        <label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px"><input type="checkbox" id="pf-dementia" ${f.hasDementia==="yes"?"checked":""} style="width:18px;height:18px;accent-color:var(--anchor)"> דמנציה / אלצהיימר</label>
      </div>
      <div class="field"><label>תקציב חודשי: <b id="pf-budval" style="color:var(--anchor)">${money(f.offeredSalary||5800)}</b></label>
        <input type="range" id="pf-bud" min="4500" max="8000" step="100" value="${f.offeredSalary||5800}"
          oninput="$('#pf-budval').textContent=(+this.value).toLocaleString('he-IL')+' ₪'" style="height:36px;accent-color:var(--anchor)"></div>
      <button class="big-btn cool" onclick="saveProfileEdits()">שמירת שינויים</button>
      <p style="font-size:11.5px;color:var(--ink-3);margin-top:8px;text-align:center">שינוי צרכים/תקציב יעדכן את מאגר ההתאמות ב"גלה" (הלייקים והמאצ'ים הקיימים לא נפגעים)</p>
      <button class="big-btn" style="background:var(--paper);color:var(--anchor);border:1.5px solid var(--line);box-shadow:none" onclick="resetSeen()">אפס/י התאמות שנצפו (התחל/י מחדש)</button>
      <button class="big-btn" style="margin-top:10px;background:transparent;color:var(--nope);box-shadow:none" onclick="logout()">${svg(I.logout,18)} התנתקות</button>
    </div>`;
}
function saveProfileEdits(){
  const name=$("#pf-name").value.trim(); if(name)me.name=name;
  me.city=$("#pf-city").value;
  me.family.gender=$("#pf-gender").value;
  me.family.requirements=$("#pf-lang").value;
  me.family.needsHoist=$("#pf-hoist").checked?"yes":"no";
  me.family.needsDiapers=$("#pf-diapers").checked?"yes":"no";
  me.family.hasDementia=$("#pf-dementia").checked?"yes":"no";
  me.family.offeredSalary=+$("#pf-bud").value;
  me.family.city=me.city;
  saveUsers();
  buildDeck();
  toast("הפרופיל עודכן ✓");
  renderProfile();
}
function resetSeen(){me.passed=[];buildDeck();saveUsers();toast("אופס — כל ההתאמות שוב זמינות");switchTab("discover");}

/* ============================================================
   BOOT
   ============================================================ */
function init(){
  loadUsers(); initCloud(); fillSignupForm();
  const sid=localStorage.getItem(SESS_KEY);
  if(!sid){ go("welcome"); return; }
  // Wait for Firebase Auth's own restored session before touching Firestore —
  // reading based on the localStorage id alone (the old behavior) raced
  // onAuthStateChanged and caused intermittent permission-denied on cold reload.
  firebase.auth().onAuthStateChanged(async user=>{
    if(user && user.uid==="fam_"+sid){
      if(users[sid]){me=users[sid];enterApp();return;}
      const u=await fetchCloud(sid);
      if(u){users[sid]=u;me=u;saveUsersLocal();enterApp();}else go("welcome");
      return;
    }
    // Firebase's persisted session didn't restore (expired/cleared) — the
    // family/name pair is still known locally, so re-authenticate silently
    // instead of bouncing the user back to a login screen.
    const cachedName=(users[sid]&&users[sid].name)||"";
    if(!cachedName){ go("welcome"); return; }
    try{
      const auth=await signInFamily(sid,cachedName,"login");
      if(auth.token){
        const u=users[sid]||await fetchCloud(sid);
        if(u){users[sid]=u;me=u;saveUsersLocal();enterApp();return;}
      }
    }catch(e){console.warn("session restore failed",e);}
    go("welcome");
  });
}
init();
</script>
</body>
</html>
