<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A2733">
<title>חיבור בקליק — אזור המטפל/ת</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--sea-950:#0A2733;--anchor:#0D4F5C;--sea-500:#2E8CA0;--sea-400:#4FA8BC;--mist:#EEF3F4;--paper:#fff;--sand:#E9B44C;
  --like:#12A594;--like-soft:#D6F1ED;--nope:#E5563E;--ink:#12242E;--ink-2:#41565F;--ink-3:#6E8189;--line:#E4ECED;
  --grad-cool:linear-gradient(150deg,#4FA8BC,#0D4F5C);--font:"Heebo",system-ui,-apple-system,sans-serif;
  --shadow:0 10px 34px -10px rgba(10,39,51,.22);--shadow-lg:0 28px 64px -14px rgba(10,39,51,.4);--nav-h:64px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:#0A2733;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
img{display:block;max-width:100%}
.app{width:min(100vw,440px);height:100dvh;max-height:940px;background:var(--mist);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
@media(min-width:460px){.app{border-radius:28px;height:min(100dvh,920px)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column}.screen.on{display:flex}
.fade{animation:fade .25s}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.big-btn{width:100%;height:54px;border-radius:16px;background:var(--sand);color:var(--sea-950);font-size:16.5px;font-weight:800;box-shadow:0 12px 26px -10px rgba(233,180,76,.55);transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.big-btn:active{transform:scale(.98)}.big-btn.cool{background:var(--grad-cool);color:#fff;box-shadow:0 12px 26px -10px rgba(13,79,92,.5)}
.big-btn.outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3);box-shadow:none}
.big-btn.ghost{background:var(--paper);color:var(--nope);box-shadow:none;border:1.5px solid var(--line)}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);padding:0 15px;font-size:15px}
.field textarea{height:auto;min-height:64px;padding:12px 15px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sea-400)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:13px;background:var(--paper);border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2)}
.opt.sel{border-color:var(--anchor);background:var(--anchor);color:#fff}
/* welcome */
#welcome{background:radial-gradient(120% 90% at 50% 8%,#12414f,#0A2733);color:#fff;align-items:center;justify-content:center;text-align:center;padding:34px}
.mark{width:min(70vw,230px);margin:0 auto 22px;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 20px 50px -10px rgba(46,140,160,.5)}
.mark img{width:100%;height:auto;display:block}
.mark svg{width:48px;height:48px}
#welcome h1{font-size:34px;font-weight:900;margin-bottom:8px}#welcome h1 span{color:var(--sand)}
#welcome .sub{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:6px}
#welcome p{color:rgba(255,255,255,.72);font-size:15.5px;line-height:1.55;max-width:300px;margin-bottom:30px}
.login-box{width:min(88vw,340px)}
.login-box .field input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;text-align:center;font-size:18px;letter-spacing:1px}
.login-box .field input::placeholder{color:rgba(255,255,255,.4)}
/* top+nav */
.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line);z-index:6}
.top .logo{width:32px;height:32px;border-radius:10px;overflow:hidden;background:#000;flex:none}
.top .logo img{width:100%;height:100%;object-fit:contain;display:block}
.top b{font-size:16px;font-weight:800;color:var(--sea-950)}.top b span{color:var(--sea-500)}
.tab{flex:1;overflow-y:auto}.tab.pad{padding:16px}
.nav{height:var(--nav-h);flex:none;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:6}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);position:relative}
.nav button svg{width:23px;height:23px}.nav button span{font-size:10px;font-weight:700}.nav button.on{color:var(--anchor)}
.nav .dot{position:absolute;top:8px;inset-inline-end:calc(50% - 16px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--nope);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
/* profile + media */
.p-hero{background:var(--grad-cool);color:#fff;padding:22px 20px;text-align:center;position:relative}
.p-photo{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:40px;font-weight:800;overflow:hidden;position:relative;cursor:pointer;border:3px solid rgba(255,255,255,.3)}
.p-photo img{width:100%;height:100%;object-fit:cover}
.p-photo .cam{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);padding:4px;font-size:10px;font-weight:700}
.p-hero h2{font-size:22px;font-weight:800}.p-hero .st{opacity:.85;font-size:13px;margin-top:2px}
.media-row{display:flex;gap:10px;padding:14px 16px}
.media-btn{flex:1;background:var(--paper);border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--ink-2);font-weight:700;font-size:13px}
.media-btn.has{border-style:solid;border-color:var(--like);color:var(--like);background:var(--like-soft)}
.media-btn svg{width:22px;height:22px;margin:0 auto 6px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.section-t{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase;margin:16px 2px 10px}
/* request cards (families) */
.rq{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.rq .rq-top{background:linear-gradient(150deg,#ffb27a,#e5563e);color:#fff;padding:18px 18px 16px}
.rq .rq-top h3{font-size:21px;font-weight:800}.rq .rq-top .loc{opacity:.92;font-size:13.5px;margin-top:3px}
.rq .rq-body{padding:14px 18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:20px;background:var(--mist);color:var(--ink-2)}
.chip.good{background:var(--like-soft);color:var(--like)}
.rq-act{display:flex;gap:10px;padding:0 18px 16px}
.rq-act .big-btn{height:48px}
.list-row{display:flex;align-items:center;gap:13px;background:var(--paper);border-radius:18px;padding:11px;margin-bottom:10px;box-shadow:0 3px 12px rgba(10,39,51,.06)}
.av{width:54px;height:54px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(150deg,#ffb27a,#e5563e)}
.list-row .m{flex:1;min-width:0}.list-row .m b{font-size:16px;font-weight:800;color:var(--sea-950)}
.list-row .m span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-head{font-size:20px;font-weight:800;color:var(--sea-950);margin:4px 2px 14px}
.badge-match{font-size:10px;font-weight:800;color:#fff;background:var(--like);padding:3px 8px;border-radius:20px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;gap:8px;height:100%}
.empty .ic{width:74px;height:74px;border-radius:22px;background:var(--grad-cool);display:grid;place-items:center;margin-bottom:6px}.empty .ic svg{width:36px;height:36px}
.empty h3{font-size:20px;font-weight:800;color:var(--sea-950)}.empty p{color:var(--ink-3);font-size:14px;max-width:250px}
/* chat */
#chat{background:#e9eef0}
.ct-head{height:60px;flex:none;background:var(--paper);display:flex;align-items:center;gap:11px;padding:0 14px;border-bottom:1px solid var(--line)}
.ct-head .back{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.ct-head .who b{font-size:15px;font-weight:800;color:var(--sea-950);display:block}.ct-head .who span{font-size:11.5px;color:var(--like)}
.ct-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.45;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--anchor);color:#fff;border-bottom-left-radius:4px}
.bub.them{align-self:flex-start;background:#fff;border-bottom-right-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub time{display:block;font-size:9.5px;opacity:.6;text-align:end;margin-top:3px}
.ct-foot{flex:none;background:var(--paper);padding:10px 12px;display:flex;gap:9px;align-items:center;border-top:1px solid var(--line)}
.ct-foot input{flex:1;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--mist);padding:0 16px;font-size:15px}
.ct-foot input:focus{outline:none;border-color:var(--sea-400)}
.ct-foot .send{width:46px;height:46px;border-radius:50%;background:var(--anchor);color:#fff;display:grid;place-items:center;flex:none}.ct-foot .send svg{width:20px;height:20px}
#toast{position:absolute;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--sea-950);color:#fff;padding:11px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:50;transition:.25s;box-shadow:var(--shadow);white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{position:absolute;inset:0;z-index:40;background:rgba(10,39,51,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:100%;max-width:340px;background:#fff;border-radius:22px;padding:22px;text-align:center;box-shadow:var(--shadow-lg)}
.modal .mi{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;background:var(--like-soft);color:var(--like)}
.modal h3{font-size:20px;font-weight:800;color:var(--sea-950);margin-bottom:6px}.modal p{font-size:14px;color:var(--ink-2);margin-bottom:16px;line-height:1.5}
</style>
</head>

/* ---------- media hosting (Cloudinary, unsigned preset — no secret in client code) ---------- */
const CLOUDINARY_CLOUD="jf9wdasm", CLOUDINARY_PRESET="hibur_unsigned";
function uploadToCloudinary(fileOrBlob,{onProgress}={}){
  return new Promise((resolve,reject)=>{
    const fd=new FormData(); fd.append("file",fileOrBlob); fd.append("upload_preset",CLOUDINARY_PRESET);
    const xhr=new XMLHttpRequest();
    xhr.open("POST",`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`);
    xhr.upload.onprogress=e=>{if(onProgress&&e.lengthComputable)onProgress(Math.round(e.loaded/e.total*100));};
    xhr.onload=()=>{try{const d=JSON.parse(xhr.responseText);
      if(xhr.status>=200&&xhr.status<300)resolve(d); else reject(new Error((d.error&&d.error.message)||"upload failed"));
    }catch(e){reject(e);}};
    xhr.onerror=()=>reject(new Error("network error"));
    xhr.send(fd);
  });
}

/* ---------- Gemini AI (shared key with family app, same origin) ---------- */
const AI_MODEL="gemini-flash-latest";
const getAIKey=()=>(localStorage.getItem("hbGeminiKey")||"").trim();
const hasAI=()=>!!getAIKey();
async function callAI(prompt,system){
  const key=getAIKey(); if(!key)throw new Error("no-key");
  const body={contents:[{role:"user",parts:[{text:prompt}]}]};
  if(system)body.systemInstruction={parts:[{text:system}]};
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${encodeURIComponent(key)}`,
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
  clearTimeout(to);
  if(!r.ok)throw new Error("AI "+r.status);
  const d=await r.json();
  return ((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("").trim();
}
async function translateMsg(text,targetLang){
  if(!hasAI()||!text.trim())return null;
  try{return await callAI(text,`Translate the user's message into ${targetLang}. Reply with ONLY the translation, nothing else — no quotes, no explanation, no original text.`);}
  catch(e){console.warn("translate",e);return null;}
}
async function callAIMedia(prompt,base64Data,mimeType,system){
  const key=getAIKey(); if(!key)throw new Error("no-key");
  const body={contents:[{role:"user",parts:[{text:prompt},{inline_data:{mime_type:mimeType,data:base64Data}}]}]};
  if(system)body.systemInstruction={parts:[{text:system}]};
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),40000);
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${encodeURIComponent(key)}`,
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
  clearTimeout(to);
  if(!r.ok)throw new Error("AI "+r.status);
  const d=await r.json();
  return ((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("").trim();
}
const blobToB64=blob=>new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result.split(",")[1]);rd.onerror=rej;rd.readAsDataURL(blob);});

const connId=c=>c.famId+"__"+c.cgId;
let requireApproval=false;
function loadHiburConfig(){
  if(!fdb)return;
  fdb.collection("hibur_config").doc("settings").onSnapshot(snap=>{
    requireApproval=!!(snap.data()&&snap.data().requireApproval);
    if($("#main").classList.contains("on"))switchTab(curTab);
  },()=>{});
}
const isMatched=c=>!!(c&&c.famLiked&&c.cgLiked&&(!requireApproval||c.approved));
function subscribeConns(){
  if(!fdb||!me)return; if(connUnsub)connUnsub();
  connUnsub=connCol().where("cgId","==",me.id).onSnapshot(snap=>{
    conns=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));
    if($("#main").classList.contains("on"))switchTab(curTab);
    if($("#chat").classList.contains("on")&&chatConn){const c=conns.find(x=>x._id===chatConn._id);if(c){chatConn=c;renderChat(c);}}
  },e=>console.warn("conn sub",e));
}

function saveGeminiKey(){const v=$("#geminiKeyInput").value.trim();localStorage.setItem("hbGeminiKey",v);toast(v?"מפתח נשמר — AI פעיל ✓":"המפתח הוסר");renderProfile();}
let mediaRecorder=null, recChunks=[], recStream=null;
async function toggleRecording(){
  const btn=$("#micBtn");
  if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return;}
  try{
    recStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){toast("אין הרשאה למיקרופון");return;}
  recChunks=[];
  mediaRecorder=new MediaRecorder(recStream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=async()=>{
    recStream.getTracks().forEach(t=>t.stop());
    btn.textContent="⏳ מתמלל…"; btn.disabled=true;
    try{
      const blob=new Blob(recChunks,{type:mediaRecorder.mimeType||"audio/webm"});
      const b64=await blobToB64(blob);
      const text=await callAIMedia(
        "תמלל/י את ההקלטה הזו לטקסט. החזר/י רק את התמלול, בלי הערות נוספות.",
        b64, blob.type||"audio/webm", "את/ה מתמלל/ת הקלטות קול לטקסט. תשובה = התמלול בלבד."
      );
      if(text){const ta=$("#f-about"); ta.value=(ta.value?ta.value+" ":"")+text; toast("תומלל ✓");}
    }catch(e){toast("שגיאה בתמלול — נסו שוב");console.warn(e);}
    btn.textContent="🎙️ הקליטו במקום לכתוב"; btn.disabled=false;
  };
  mediaRecorder.start();
  btn.textContent="⏹️ עצירת הקלטה"; btn.style.background="var(--nope-soft,#FADFD9)"; btn.style.color="var(--nope)";
}
function docCheckHtml(w){
  if(!w.idDocCheck)return "";
  const ok=w.idDocCheck.ok;
  return `<div class="rec" style="margin-top:10px;background:${ok?"var(--like-soft)":"#FADFD9"}">
    <div class="who" style="color:${ok?"var(--like)":"var(--nope)"}">${ok?"✅ המסמך נראה תקין":"⚠️ נדרשת בדיקה ידנית"}</div>
    ${esc(w.idDocCheck.reason||"")}</div>`;
}
$("#docInput").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  if(!hasAI()){toast("הזינו מפתח Gemini למטה כדי להפעיל בדיקה אוטומטית");}
  toast("מעלה מסמך…");
  try{
    const [uploadRes,b64]=await Promise.all([uploadToCloudinary(f),blobToB64(f)]);
    me.idDoc=uploadRes.secure_url; saveMe();
    if(hasAI()){
      toast("בודק מסמך…");
      try{
        const raw=await callAIMedia(
          "זהו צילום של מסמך זיהוי (דרכון או ויזה) של מטפל/ת סיעודי/ת. בדוק/י: האם ניתן לזהות שזהו אכן מסמך רשמי, האם התמונה ברורה וקריאה, והאם נראה בתוקף (אם יש תאריך תפוגה גלוי). "+
          'החזר/י אך ורק JSON: {"ok":true|false,"reason":"משפט קצר בעברית"}',
          b64, f.type||"image/jpeg", "את/ה בודק/ת מסמכי זהות עבור צוות גיוס. תשובה קצרה, JSON בלבד."
        );
        const m=raw.match(/\{[\s\S]*\}/);
        const d=m?JSON.parse(m[0]):{ok:false,reason:"לא ניתן היה לנתח את המסמך אוטומטית"};
        me.idDocCheck={ok:!!d.ok,reason:d.reason||"",checkedAt:nowT()};
      }catch(err){me.idDocCheck={ok:false,reason:"שגיאה בבדיקה האוטומטית — יבדק ידנית",checkedAt:nowT()};console.warn(err);}
      saveMe();
    }
    toast("המסמך נשמר ✓"); renderProfile();
  }catch(err){toast("שגיאה בהעלאה — נסו שוב");console.warn(err);}
  e.target.value="";
};
async function generateBio(){
  const about=($("#f-about")||{}).value||me.about||"";
  if(!about.trim()){toast("כתוב/כתבי קודם כמה מילים על עצמך למעלה");return;}
  toast("מנסח…");
  try{
    const bio=await callAI(
      `שם: ${me.name||"מטפל/ת"}, לאום: ${me.nationality||"—"}, ניסיון: ${me.experience||"—"} שנים, שפות: ${me.languages||"—"}.\n`+
      `מה שהמטפל/ת כתב/ה על עצמו/ה: "${about}"\n\nנסח/י מזה תיאור קצר (2-3 משפטים) חם ומקצועי בעברית, בגוף שלישי, שמציג את המטפל/ת למשפחות. בלי הגזמות, בלי כותרות.`,
      "את/ה כותב/ת קופי מקצועי לפרופילי מטפלים באפליקציית התאמה. תשובה קצרה וחמה בלבד, בלי מירכאות."
    );
    if(bio){me.about=about;me.bio=bio;saveMe();toast("התיאור נוצר ✓");renderProfile();}
  }catch(e){toast("שגיאה — נסו שוב");console.warn(e);}
}
const yn=(k,v)=>`<div class="opts" id="yn-${k}">${[["yes","כן"],["no","לא"]].map(([val,l])=>`<button class="opt ${v===val?"sel":""}" data-v="${val}" onclick="pickYN('${k}','${val}')">${l}</button>`).join("")}</div>`;
let ynState={};
function pickYN(k,v){ynState[k]=v;$$("#yn-"+k+" .opt").forEach(b=>b.classList.toggle("sel",b.dataset.v===v));}
function saveProfile(){
  me.name=$("#f-name").value.trim(); me.nationality=$("#f-nat").value; me.gender=$("#f-gender").value;
  me.age=$("#f-age").value; me.city=$("#f-city").value; me.phone=$("#f-phone").value.trim(); me.email=$("#f-email").value.trim();
  me.languages=$("#f-lang").value.trim(); me.experience=$("#f-exp").value; me.expectedSalary=+$("#f-sal").value||0;
  me.canHoist=ynState.hoist||me.canHoist; me.canDiapers=ynState.diapers||me.canDiapers; me.knowsDementia=ynState.dementia||me.knowsDementia;
  me.about=($("#f-about")||{}).value||me.about||"";
  saveMe(); toast("הפרופיל נשמר ✓"); renderProfile();
}
/* photo upload → resize client-side → upload to Cloudinary → store secure_url */
$("#photoInput").onchange=e=>{const f=e.target.files[0];if(!f)return;
  const img=new Image();const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    const cv=document.createElement("canvas");const max=900;let{width:w,height:h}=img;
    if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
    cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    cv.toBlob(async blob=>{
      toast("מעלה תמונה…");
      try{const res=await uploadToCloudinary(blob);
        me.photo=res.secure_url; saveMe(); toast("התמונה הועלתה ✓"); renderProfile();
      }catch(err){toast("שגיאה בהעלאה — נסו שוב");console.warn(err);}
    },"image/jpeg",0.82);
  };img.src=rd.result;};rd.readAsDataURL(f);};
function openVideoModal(){
  $("#modalRoot").innerHTML=`<div class="scrim" onclick="if(event.target===this)this.remove()"><div class="modal">
    <div class="mi">${svg(I.video,28)}</div><h3>סרטון היכרות</h3>
    <p>העלו סרטון קצר (עד 60MB) ישירות מהמכשיר — המשפחות יוכלו לצפות בו בפרופיל שלכם.</p>
    <button class="big-btn cool" onclick="$('#modalRoot').innerHTML='';$('#videoInput').click()">${svg(I.cam,18)} העלאת סרטון מהמכשיר</button>
    <div style="margin:16px 0 10px;font-size:12px;color:var(--ink-3)">— או הדביקו קישור קיים —</div>
    <div class="field"><input id="vurl" placeholder="https://..." value="${esc(me.video&&me.video.includes('res.cloudinary.com')?'':(me.video||''))}" dir="ltr" style="text-align:left"></div>
    <button class="big-btn" style="background:var(--paper);border:1.5px solid var(--line);box-shadow:none;color:var(--ink-2)" onclick="const v=$('#vurl').value.trim();if(v){me.video=v;saveMe();toast('נשמר ✓');renderProfile();}$('#modalRoot').innerHTML=''">שמירת קישור</button>
  </div></div>`;
}
$("#videoInput").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  if(f.size>60*1024*1024){toast("הסרטון גדול מדי — עד 60MB");e.target.value="";return;}
  $("#modalRoot").innerHTML=`<div class="scrim"><div class="modal"><div class="mi">${svg(I.video,28)}</div><h3>מעלה סרטון…</h3><p id="vidPct" style="font-size:22px;font-weight:800;color:var(--anchor)">0%</p></div></div>`;
  try{
    const res=await uploadToCloudinary(f,{onProgress:p=>{const el=$("#vidPct");if(el)el.textContent=p+"%";}});
    me.video=res.secure_url; saveMe(); $("#modalRoot").innerHTML=""; toast("הסרטון הועלה ✓"); renderProfile();
  }catch(err){ $("#modalRoot").innerHTML=""; toast("שגיאה בהעלאת הסרטון — נסו שוב"); console.warn(err); }
  e.target.value="";
};

/* ---------- REQUESTS (families interested) ---------- */
function renderRequests(){const tab=$("#tab");tab.className="tab pad";
  if(!me.name){tab.innerHTML=emptyState(I.user,"קודם השלימו פרופיל","מלאו את הפרטים והעלו תמונה — כדי שמשפחות יוכלו למצוא אתכם");return;}
  const rq=conns.filter(c=>c.cgId===me.id&&c.famLiked&&!c.cgLiked);
  if(!rq.length){tab.innerHTML=emptyState(I.heart,"אין פניות חדשות","כשמשפחה תסמן שהיא מעוניינת בך — היא תופיע כאן, ותוכל/י להשיב");return;}
  tab.innerHTML=`<div class="list-head">${rq.length} משפחות מעוניינות בך</div>`+rq.map(c=>{const f=c.fam||{};
    return `<div class="rq">
      <div class="rq-top"><h3>${esc(f.name||"משפחה")}</h3><div class="loc">${esc(f.city||"")} · תקציב ${money(f.budget)}</div></div>
      <div class="rq-body"><div class="chips">
        ${f.needHoist==="yes"?'<span class="chip good">🛠️ נדרש מנוף</span>':""}
        ${f.needDementia==="yes"?'<span class="chip good">🧠 דמנציה</span>':""}
        ${f.needDiapers==="yes"?'<span class="chip good">🧴 טיפול אישי</span>':""}
        ${f.gender?`<span class="chip">${f.gender==="female"?"מבקשים מטפלת":"מבקשים מטפל"}</span>`:""}
        ${f.req?`<span class="chip">שפה: ${esc(f.req)}</span>`:""}
      </div></div>
      <div class="rq-act">
        <button class="big-btn ghost" style="flex:none;width:56px" onclick="respond('${c._id}',false)">${svg(I.x,22)}</button>
        <button class="big-btn cool" onclick="respond('${c._id}',true)">מעוניין/ת! ♥</button>
      </div></div>`;}).join("");
}
function respond(cid,yes){
  connCol().doc(cid).set({cgLiked:yes,cgId:me.id,cg:cgSnap(),updatedAt:nowT()},{merge:true})
    .then(()=>{ if(yes){const c=conns.find(x=>x._id===cid);
      if(requireApproval)toast("הועבר לאישור רכז/ת עוגן — נעדכן ברגע שיאושר");
      else showMatch(c&&c.fam?c.fam.name:"המשפחה"); } })
    .catch(e=>console.warn(e));
  if(!yes)toast("דילגת");
}
const cgSnap=()=>({name:me.name,lastName:"",city:me.city,nationality:me.nationality,photo:me.photo||"",age:me.age||"",phone:me.phone||""});
function showMatch(famName){
  $("#modalRoot").innerHTML=`<div class="scrim" onclick="if(event.target===this)this.remove()"><div class="modal">
    <div class="mi">${svgF(I.heart,30)}</div><h3>יש התאמה! 🎉</h3>
    <p>גם ${esc(famName)} מעוניינת. אפשר להתחיל לשוחח ולתאם היכרות.</p>
    <button class="big-btn cool" onclick="$('#modalRoot').innerHTML='';switchTab('chats')">לצ'אט 💬</button>
  </div></div>`;
}

/* ---------- MATCHES + CHATS ---------- */
function matchedConns(){return conns.filter(isMatched);}
function renderMatches(){const tab=$("#tab");tab.className="tab pad";const ms=matchedConns();
  if(!ms.length){tab.innerHTML=emptyState(I.match,"אין מאצ'ים עדיין","כשתשיב/י בחיוב לפנייה של משפחה — היא תופיע כאן");return;}
  tab.innerHTML=`<div class="list-head">${ms.length} מאצ'ים</div>`+ms.map(c=>rowFam(c,`onclick="openChat('${c._id}')"`,`<button class="big-btn cool" style="width:auto;height:38px;padding:0 16px;font-size:13px">שוחח/י 💬</button>`)).join("");
}
function renderChats(){const tab=$("#tab");tab.className="tab pad";const cs=matchedConns().filter(c=>(c.msgs||[]).length).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(!cs.length){tab.innerHTML=emptyState(I.chat,"אין שיחות עדיין","התחילו שיחה מתוך מאצ'");return;}
  tab.innerHTML=`<div class="list-head">שיחות</div>`+cs.map(c=>{const lm=(c.msgs||[]).slice(-1)[0];
    return `<div class="list-row" onclick="openChat('${c._id}')"><div class="av">${esc((c.fam?.name||"?")[0])}</div>
    <div class="m"><b>${esc(c.fam?.name||"משפחה")}</b><span>${esc(lm?lm.text:"")}</span></div>
    <div style="text-align:center"><div style="font-size:11px;color:var(--ink-3)">${lm?timeStr(lm.at):""}</div></div></div>`;}).join("");
}
function rowFam(c,attr,side){const f=c.fam||{};return `<div class="list-row" ${attr}><div class="av">${esc((f.name||"?")[0])}</div>
  <div class="m"><b>${esc(f.name||"משפחה")}</b><span>${esc(f.city||"")} · תקציב ${money(f.budget)}</span></div><div>${side||""}</div></div>`;}
function emptyState(icon,h,p){return `<div class="empty"><div class="ic">${svg(icon,36)}</div><h3>${h}</h3><p>${p}</p></div>`;}

/* ---------- CHAT ---------- */
function openChat(cid){chatConn=conns.find(c=>c._id===cid);if(!chatConn)return;renderChat(chatConn);go("chat");}
function renderChat(c){const f=c.fam||{};const msgs=c.msgs||[];
  $("#chat").innerHTML=`
    <div class="ct-head"><button class="back" onclick="go('main');switchTab('chats')">→</button>
      <div class="av" style="width:40px;height:40px;border-radius:50%;font-size:16px">${esc((f.name||"?")[0])}</div>
      <div class="who"><b>${esc(f.name||"משפחה")}</b><span>${esc(f.city||"")}</span></div>
      <a class="wa" style="margin-inline-start:auto;color:var(--anchor)" href="${jitsiLink(c._id)}" target="_blank" title="שיחת וידאו">${svg(I.video,20)}</a></div>
    <div class="ct-body" id="ctBody">${msgs.length?msgs.map(bubble).join(""):`<div style="text-align:center;color:var(--ink-3);font-size:12px;padding:8px">תחילת השיחה עם ${esc(f.name||"המשפחה")}</div>`}</div>
    <div class="ct-foot"><input id="ctInput" placeholder="הקלד/י הודעה…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="send" onclick="sendMsg()">${svg(I.send,20)}</button></div>`;
  const b=$("#ctBody");b.scrollTop=b.scrollHeight;
}
function bubble(m){
  const mine=m.from==="cg";
  const primary=mine?m.text:(m.translated||m.text);
  const secondary=mine?m.translated:(m.translated?m.text:null);
  return `<div class="bub ${mine?"me":"them"}">${esc(primary)}
    ${secondary?`<div style="opacity:.7;font-size:11.5px;margin-top:5px;padding-top:5px;border-top:1px solid rgba(0,0,0,.12)">🌐 ${esc(secondary)}</div>`:""}
    <time>${timeStr(m.at)}</time></div>`;
}
async function sendMsg(){const inp=$("#ctInput");const t=inp.value.trim();if(!t||!chatConn)return;inp.value="";
  const msg={from:"cg",text:t,at:nowT()};
  const tr=await translateMsg(t,"Hebrew");
  if(tr){msg.translated=tr;msg.translatedLang="עברית";}
  connCol().doc(chatConn._id).set({msgs:AU(msg),updatedAt:nowT()},{merge:true}).catch(e=>console.warn(e));
  chatConn.msgs=(chatConn.msgs||[]).concat(msg);renderChat(chatConn);
  const waPhone=chatConn.fam&&chatConn.fam.phone; if(waPhone)bridgeToWhatsapp(waPhone,msg.translated||t);
}

/* ---------- boot ---------- */
async function init(){
  if(localStorage.getItem("hbcg_consent")==="1"){const c=$("#li-consent");if(c)c.checked=true;}
  const sid=localStorage.getItem(SESS);
  if(sid&&fdb){ try{const s=await cgDoc(sid).get();if(s.exists){me=s.data();enterApp();return;}}catch(e){} }
  go("welcome");
}
init();
</script>
