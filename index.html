<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2733">
<title>עוגן CRM — מערכת השמה</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- production-parity integrations: Firebase sync, Excel (loaded from CDN, per spec) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   עוגן CRM · Design system — "Anchor"
   ============================================================ */
:root{
  --sea-950:#0A2733; --sea-900:#0C3543; --anchor:#0D4F5C; --anchor-600:#0B4753;
  --sea-500:#2E8CA0; --sea-400:#4FA8BC; --mist:#EEF3F4; --mist-2:#E4ECED;
  --paper:#FFFFFF; --sand:#E9B44C; --sand-soft:#F7E6BF;
  --ok:#10916E; --ok-soft:#DCF2EA; --warn:#E0913A; --warn-soft:#FBEBD6;
  --danger:#D64550; --danger-soft:#F8DDDF; --cold:#5B8DEF; --cold-soft:#E1EAFC;
  --hot:#E5563E; --hot-soft:#FADFD9; --warm:#E0913A;
  --ink:#12242E; --ink-2:#41565F; --ink-3:#6E8189; --line:#D7E1E3;
  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(10,39,51,.06),0 1px 3px rgba(10,39,51,.05);
  --shadow:0 4px 16px rgba(10,39,51,.08),0 1px 3px rgba(10,39,51,.06);
  --shadow-lg:0 24px 60px -12px rgba(10,39,51,.28);
  --rail:78px; --font:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--mist); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-feature-settings:"tnum" 0; line-height:1.5; overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::selection{background:var(--sea-400);color:#fff}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em;color:var(--sea-950)}
a{color:var(--sea-500);text-decoration:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--mist-2);border-radius:20px;border:2px solid var(--mist)}
::-webkit-scrollbar-thumb:hover{background:var(--line)}

/* ---------- Lock screen ---------- */
#lock{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 80% 0%,var(--sea-900),var(--sea-950));color:#fff}
.lock-card{width:min(92vw,380px);text-align:center;padding:8px}
.lock-mark{width:74px;height:74px;margin:0 auto 20px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:22px}
.lock-mark svg{width:40px;height:40px}
.lock-card h1{color:#fff;font-size:26px;font-weight:800;margin-bottom:4px}
.lock-card p{color:rgba(255,255,255,.6);font-size:14px;margin-bottom:26px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:26px}
.pin-dots i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.18);transition:.15s}
.pin-dots i.on{background:var(--sand);box-shadow:0 0 0 4px rgba(233,180,76,.18)}
.pin-dots.err i{background:var(--danger)!important;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto}
.keypad button{height:60px;border-radius:16px;background:rgba(255,255,255,.06);color:#fff;font-size:23px;
  font-weight:600;border:1px solid rgba(255,255,255,.09);transition:.12s}
.keypad button:hover{background:rgba(255,255,255,.13)}
.keypad button:active{transform:scale(.95)}
.keypad button.ghost{background:none;border:none;font-size:15px;font-weight:500;color:rgba(255,255,255,.55)}
.lock-msg{min-height:20px;margin-top:20px;font-size:13.5px;color:var(--sand)}
#pinInput:focus{outline:none;border-color:var(--sand)!important;background:rgba(255,255,255,.1)!important}
#pinInput.shake{animation:shake .4s}
#pinGo:active{transform:scale(.98)}

/* ---------- App shell ---------- */
#app{display:flex;height:100%}
.rail{width:var(--rail);flex:none;background:var(--sea-950);display:flex;flex-direction:column;
  align-items:center;padding:16px 0;gap:6px;z-index:40}
.rail .brand{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;
  background:linear-gradient(150deg,var(--anchor),var(--sea-500))}
.rail .brand svg{width:26px;height:26px}
.rail nav{display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;flex:1}
.rail button.nav{width:56px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:rgba(255,255,255,.55);position:relative;transition:.14s}
.rail button.nav svg{width:21px;height:21px}
.rail button.nav span{font-size:9.5px;font-weight:600;letter-spacing:.01em}
.rail button.nav:hover{color:#fff;background:rgba(255,255,255,.06)}
.rail button.nav.active{color:#fff;background:linear-gradient(150deg,var(--anchor),var(--anchor-600))}
.rail button.nav .badge{position:absolute;top:6px;left:9px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--sand);color:var(--sea-950);font-size:10px;font-weight:800;
  display:grid;place-items:center}
.rail .spacer{flex:1}

.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{height:64px;flex:none;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;z-index:30}
.topbar .page-title{font-size:19px;font-weight:800;color:var(--sea-950)}
.topbar .page-title small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);margin-top:1px}
.search-wrap{position:relative;flex:1;max-width:520px;margin-inline-start:auto}
.search-wrap svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.search-wrap input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--mist);
  padding:0 42px;font-size:14px;transition:.14s}
.search-wrap input:focus{outline:none;background:#fff;border-color:var(--sea-400);box-shadow:0 0 0 4px rgba(79,168,188,.14)}
.topbar .who{display:flex;align-items:center;gap:10px;padding-inline-start:8px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,var(--sea-500),var(--anchor));
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.who .meta{font-size:12.5px;line-height:1.3}
.who .meta b{font-weight:700;color:var(--sea-950)}
.who .meta span{color:var(--ink-3)}

.view{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.view-inner{max-width:1240px;margin:0 auto}

/* ---------- Reusable ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:11px;
  font-weight:600;font-size:13.5px;background:#fff;color:var(--ink);border:1px solid var(--line);
  transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--sea-400);color:var(--anchor)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--anchor);color:#fff;border-color:var(--anchor)}
.btn.primary:hover{background:var(--anchor-600);color:#fff}
.btn.sand{background:var(--sand);color:var(--sea-950);border-color:var(--sand)}
.btn.sand:hover{filter:brightness(.96)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--mist-2);color:var(--anchor)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{height:33px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn.icon{width:40px;padding:0;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px;border-radius:20px;
  font-size:11.5px;font-weight:700;background:var(--mist-2);color:var(--ink-2)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.tag{display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:7px;font-size:11px;
  font-weight:600;background:var(--sea-500);background:rgba(46,140,160,.12);color:var(--anchor)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);
  background:var(--mist);padding:0 13px;font-size:14px;transition:.14s}
.field textarea{height:auto;min-height:76px;padding:11px 13px;resize:vertical;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;background:#fff;
  border-color:var(--sea-400);box-shadow:0 0 0 4px rgba(79,168,188,.13)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.section-label{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);
  text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.empty svg{width:52px;height:52px;opacity:.4;margin-bottom:14px}
.empty h3{color:var(--ink-2);font-weight:700;margin-bottom:5px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.toolbar .seg{display:flex;background:var(--mist-2);border-radius:11px;padding:3px}
.toolbar .seg button{height:32px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.toolbar .seg button.on{background:#fff;color:var(--anchor);box-shadow:var(--shadow-sm)}
.toolbar select.filter{height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
  padding:0 12px;font-size:13px;font-weight:500}
.spacer{flex:1}

/* temperature dots */
.temp{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700}
.temp .dot{width:9px;height:9px;border-radius:50%}
.temp.hot{color:var(--hot)} .temp.hot .dot{background:var(--hot);box-shadow:0 0 0 3px var(--hot-soft)}
.temp.warm{color:var(--warm)} .temp.warm .dot{background:var(--warm);box-shadow:0 0 0 3px var(--warn-soft)}
.temp.cold{color:var(--cold)} .temp.cold .dot{background:var(--cold);box-shadow:0 0 0 3px var(--cold-soft)}

/* status pills */
.st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:20px;
  font-size:11.5px;font-weight:700}
.st .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.st.s-new{background:var(--cold-soft);color:#3466c9}
.st.s-active{background:var(--warn-soft);color:#b5701f}
.st.s-offered{background:rgba(46,140,160,.15);color:var(--anchor)}
.st.s-won{background:var(--ok-soft);color:var(--ok)}
.st.s-lost{background:var(--danger-soft);color:var(--danger)}
.st.w-avail{background:var(--ok-soft);color:var(--ok)}
.st.w-proc{background:var(--warn-soft);color:#b5701f}
.st.w-placed{background:rgba(46,140,160,.15);color:var(--anchor)}
.st.w-irr{background:var(--mist-2);color:var(--ink-3)}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.kpi .ic svg{width:20px;height:20px}
.kpi .n{font-size:34px;font-weight:800;color:var(--sea-950);letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:6px}
.kpi .trend{position:absolute;top:18px;inset-inline-start:18px;font-size:11.5px;font-weight:700}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel .hd{display:flex;align-items:center;gap:9px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel .hd h3{font-size:15px}
.panel .hd .btn{margin-inline-start:auto}
.panel .bd{padding:8px 10px}
.brief{padding:18px;line-height:1.7;font-size:14px;color:var(--ink-2)}
.brief b{color:var(--sea-950);font-weight:700}
.urg{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;transition:.12s;cursor:pointer}
.urg:hover{background:var(--mist)}
.urg .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center}
.urg .ic svg{width:17px;height:17px}
.urg .tx{flex:1;min-width:0}
.urg .tx b{font-size:13.5px;font-weight:600;color:var(--sea-950);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urg .tx span{font-size:12px;color:var(--ink-3)}

/* ---------- Lead / worker cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.lc{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;
  box-shadow:var(--shadow-sm);transition:.15s;cursor:pointer;position:relative}
.lc:hover{box-shadow:var(--shadow);border-color:var(--sea-400);transform:translateY(-1px)}
.lc .top{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
.lc .who-ic{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-weight:700;font-size:16px;color:#fff}
.lc .nm{flex:1;min-width:0}
.lc .nm h4{font-size:15.5px;font-weight:700;color:var(--sea-950);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .nm .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .star{position:absolute;top:13px;inset-inline-start:13px;width:26px;height:26px;color:var(--line)}
.lc .star.on{color:var(--sand)}
.lc .star svg{width:19px;height:19px}
.lc .meta-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:11px}
.lc .foot{display:flex;align-items:center;gap:8px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3)}
.lc .foot .sep{margin-inline:2px}
.pred{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:700}
.pred.high{background:var(--ok-soft);color:var(--ok)}
.pred.medium{background:var(--warn-soft);color:#b5701f}
.pred.low{background:var(--danger-soft);color:var(--danger)}
.cap{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 8px;border-radius:7px;
  font-size:11px;font-weight:600;background:var(--mist-2);color:var(--ink-2)}
.cap.yes{background:var(--ok-soft);color:var(--ok)}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.kcol{background:var(--mist-2);border-radius:var(--radius);padding:10px;min-height:120px}
.kcol.drag-over{outline:2px dashed var(--sea-400);outline-offset:-3px;background:rgba(79,168,188,.08)}
.kcol .khd{display:flex;align-items:center;gap:7px;padding:4px 6px 12px;font-size:12.5px;font-weight:800;color:var(--sea-950)}
.kcol .khd .cnt{margin-inline-start:auto;background:#fff;border-radius:20px;padding:1px 8px;font-size:11px;color:var(--ink-3)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;
  box-shadow:var(--shadow-sm);cursor:grab;transition:.12s}
.kcard:hover{box-shadow:var(--shadow)}
.kcard.dragging{opacity:.5}
.kcard h5{font-size:13.5px;font-weight:700;color:var(--sea-950);margin-bottom:5px}
.kcard .kmeta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}

/* ---------- Match view ---------- */
.match-head{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.match-head .who-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.mcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--shadow);transition:.16s}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mcard .mtop{padding:18px;display:flex;gap:14px;align-items:center;
  background:linear-gradient(160deg,var(--sea-900),var(--sea-950));color:#fff}
.ring{width:74px;height:74px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg);width:74px;height:74px}
.ring .rbg{fill:none;stroke:rgba(255,255,255,.14);stroke-width:7}
.ring .rfg{fill:none;stroke:var(--sand);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .rval{position:absolute;text-align:center}
.ring .rval b{font-size:21px;font-weight:800;line-height:1}
.ring .rval span{font-size:9px;opacity:.7;font-weight:600}
.mcard .mtop .mnm h4{color:#fff;font-size:17px}
.mcard .mtop .mnm .msub{color:rgba(255,255,255,.65);font-size:12.5px;margin-top:2px}
.mcard .mbody{padding:15px 18px}
.reasons{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.reason{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.reason svg{width:15px;height:15px;flex:none}
.reason.plus svg{color:var(--ok)} .reason.info svg{color:var(--sea-500)}
.reason b{color:var(--sea-950);font-weight:700}
.mcard .mact{display:flex;gap:8px}
.mcard .mact .btn{flex:1;justify-content:center}
.rejected{opacity:.62}
.rej-list{background:var(--danger-soft);border-radius:10px;padding:10px 12px;margin-top:6px}
.rej-list .reason{color:var(--danger)}

/* ---------- Reports ---------- */
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:start;font-size:11px;font-weight:800;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--mist-2)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:var(--mist)}
.bar{height:8px;border-radius:20px;background:var(--mist-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--sea-500),var(--anchor))}
.spark{display:flex;align-items:flex-end;gap:3px;height:56px}
.spark i{flex:1;background:linear-gradient(180deg,var(--sea-400),var(--anchor));border-radius:3px 3px 0 0;min-height:3px;transition:.4s}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;z-index:120;background:rgba(10,39,51,.42);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:34px 18px;overflow-y:auto;
  opacity:0;animation:fade .18s forwards}
@keyframes fade{to{opacity:1}}
.modal{width:min(96vw,720px);background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  animation:pop .22s cubic-bezier(.2,.9,.3,1.1);margin:auto 0}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal .mhd{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--paper);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:2}
.modal .mhd h3{font-size:17px;flex:1}
.modal .mhd .x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.modal .mhd .x:hover{background:var(--mist-2);color:var(--ink)}
.modal .mbd{padding:20px 22px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal .mft{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--paper);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.modal .mft .spacer{flex:1}
.mtabs{display:flex;gap:4px;background:var(--mist-2);border-radius:11px;padding:3px;margin-bottom:18px}
.mtabs button{flex:1;height:34px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mtabs button.on{background:#fff;color:var(--anchor);box-shadow:var(--shadow-sm)}
.activity{display:flex;gap:11px;padding:10px 2px}
.activity .aic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--mist-2);color:var(--sea-500)}
.activity .aic svg{width:15px;height:15px}
.activity .atx{flex:1;font-size:13px}
.activity .atx b{font-weight:600;color:var(--sea-950)}
.activity .atx time{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.addact{display:flex;gap:8px;margin-top:10px}
.addact input{flex:1}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:22px;inset-inline-start:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:11px;background:var(--sea-950);color:#fff;padding:12px 16px;
  border-radius:12px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;max-width:340px;
  animation:slideup .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slideup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.toast svg{width:19px;height:19px;flex:none}
.toast.ok svg{color:var(--sand)} .toast.err svg{color:#ff8f83}

/* ---------- Interview mode (WhatsApp style) ---------- */
#interview{position:fixed;inset:0;z-index:150;background:#0b141a;display:none;flex-direction:column}
#interview.on{display:flex}
.iv-head{height:64px;flex:none;background:#202c33;display:flex;align-items:center;gap:12px;padding:0 16px;color:#e9edef}
.iv-head .ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,var(--sea-500),var(--anchor));
  display:grid;place-items:center;font-weight:700}
.iv-head .info b{font-size:15px;font-weight:600;display:block}
.iv-head .info span{font-size:12px;color:#8696a0}
.iv-body{flex:1;overflow-y:auto;padding:20px 6vw;background-image:linear-gradient(rgba(11,20,26,.94),rgba(11,20,26,.94));
  display:flex;flex-direction:column;gap:9px}
@media(min-width:700px){.iv-body{padding:20px 22vw}}
.bub{max-width:78%;padding:9px 13px;border-radius:12px;font-size:14.5px;line-height:1.5;position:relative;
  animation:pop .2s;white-space:pre-wrap;word-wrap:break-word}
.bub.them{align-self:flex-start;background:#202c33;color:#e9edef;border-top-right-radius:3px}
.bub.me{align-self:flex-end;background:#005c4b;color:#e9edef;border-top-left-radius:3px}
.bub time{display:block;font-size:10px;color:rgba(233,237,239,.5);text-align:end;margin-top:3px}
.typing{align-self:flex-start;background:#202c33;padding:14px 16px;border-radius:12px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.iv-foot{flex:none;background:#202c33;padding:10px 14px;display:flex;gap:10px;align-items:center}
.iv-foot input{flex:1;height:46px;border-radius:24px;border:none;background:#2a3942;color:#e9edef;padding:0 18px;font-size:15px}
.iv-foot input:focus{outline:none}
.iv-foot button{width:48px;height:48px;border-radius:50%;background:#00a884;color:#fff;display:grid;place-items:center;flex:none}
.iv-foot button svg{width:22px;height:22px}
.iv-lang{display:flex;flex-wrap:wrap;gap:8px;padding:16px;justify-content:center}
.iv-lang button{padding:10px 16px;border-radius:22px;background:#202c33;color:#e9edef;font-size:14px;font-weight:600;border:1px solid #2a3942}
.iv-lang button:hover{background:#2a3942}
.iv-done{text-align:center;padding:30px 20px;color:#8696a0}
.iv-done .v{width:64px;height:64px;border-radius:50%;background:#005c4b;display:grid;place-items:center;margin:0 auto 16px}
.iv-done .v svg{width:34px;height:34px;color:#fff}
.iv-done h2{color:#e9edef;margin-bottom:6px}

/* QR box */
.qrbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.qr{width:150px;height:150px;background:#fff;border-radius:14px;padding:10px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;font-size:12px;direction:ltr;text-align:left}

@media(max-width:920px){
  .kpis{grid-template-columns:repeat(2,1fr)} .dash-grid,.rep-grid{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr;overflow-x:visible}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media(max-width:640px){
  .rail{position:fixed;bottom:0;top:auto;width:100%;height:64px;flex-direction:row;padding:0;
    border-top:1px solid rgba(255,255,255,.08);z-index:60}
  .rail .brand,.rail .spacer{display:none}

  .rail button.nav{width:auto;flex:1;height:100%;border-radius:0}
  .main{padding-bottom:64px} .kpis{grid-template-columns:1fr}
  .search-wrap{display:none} .view{padding:16px}
}

<script>
/* ============================================================
   עוגן CRM · single-file · Vanilla JS  (build from master spec)
   ============================================================ */
"use strict";
const LS_KEY = "ogenCRM3";
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

/* ---------- security helpers (spec א7) ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = (s,max=200)=>String(s??"").replace(/<[^>]*>/g,"").replace(/javascript:/gi,"")
  .replace(/[\u0000-\u001F\u007F]/g,"").trim().slice(0,max);
const cleanInt = (v,min,max)=>{const n=parseInt(String(v).replace(/[^\d-]/g,""),10);
  return isNaN(n)?"":Math.max(min,Math.min(max,n));};
function sanitizeDb(d){ // strip <> from every text field, on load / sync / save
  const scrub=o=>{for(const k in o){const v=o[k];
    if(typeof v==="string")o[k]=v.replace(/[<>]/g,"");
    else if(Array.isArray(v))v.forEach(x=>typeof x==="string"?0:(x&&typeof x==="object"&&scrub(x)));
    else if(v&&typeof v==="object")scrub(v);}};
  ["leads","workers","matches","staff","templates"].forEach(c=>(d[c]||[]).forEach(scrub));
  return d;
}
const uid = p => p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now = () => new Date().toISOString();
const fmtDate = s => s? new Date(s).toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "—";

const daysSince = s => s? Math.floor((Date.now()-new Date(s))/864e5) : 999;
const money = n => n? Number(n).toLocaleString("he-IL")+" ₪" : "—";

/* ---------- constants ---------- */
const LEAD_ST = ["חדש","בטיפול","הוצע עובד","סגור-הצלחה","סגור-כישלון"];

  "זמין":"w-avail","בתהליך":"w-proc","מוצב":"w-placed","לא רלוונטי":"w-irr"};

const avaColor = s => iconAvatarColors[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%iconAvatarColors.length];
const initials = (a,b)=>((a||"?")[0]+(b?b[0]:"")).toUpperCase();

/* ---------- icons ---------- */
const I = {
  dash:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',

  chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  report:'<path d="M18 20V10M12 20V4M6 20v-6"/>',

  star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',

  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  fire:'<path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-1 .5-2 .5-2S6 10 6 14a6 6 0 0 0 12 0c0-5-6-12-6-12z"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',

  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>', note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  location:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM21 14v3M14 21h7"/>',

};
const svg=(p,w=20)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:${w}px;height:${w}px">${p}</svg>`;
const svgFill=(p,w=20)=>`<svg viewBox="0 0 24 24" fill="currentColor" style="width:${w}px;height:${w}px">${p}</svg>`;

/* ============================================================
   DATA LAYER
   ============================================================ */
let db = {leads:[],workers:[],matches:[],staff:[],templates:[],outcomes:[]};
let saveTimer=null;
function load(){
  try{const raw=localStorage.getItem(LS_KEY); if(raw){db=JSON.parse(raw);}}
  catch(e){console.warn("load failed",e);}
  for(const c of ["leads","workers","matches","staff","templates","outcomes"]) if(!Array.isArray(db[c])) db[c]=[];
  if(!db.staff.length) db.staff=[{id:"u1",name:"דביר בנגי",role:"מנהל השמה",code:"2002דביר"},{id:"u4",name:"ניריה ביתן",role:"מנהל השמה",code:"2002ניריה"},{id:"u5",name:"יעל ביתן",role:"מנהל השמה",code:"2002יעל"},{id:"u6",name:"יהודה ארדוט",role:"מנהל השמה",code:"2002יהודה"},{id:"u2",name:"יוסי כהן",role:"רכז"},{id:"u3",name:"מרים אבוקסיס",role:"רכזת בכירה"}];
  purgeOldDeleted(); // auto-clean recycle bin after 30 days (spec א7)
  sanitizeDb(db);
  computeLearning(); // build LEARNED weights from outcome history
}
function save(){ // localStorage immediate + (debounced cloud would go here)
  sanitizeDb(db);
  try{localStorage.setItem(LS_KEY,JSON.stringify(db));}
  catch(e){ if(e.name==="QuotaExceededError") toast("אחסון מלא — ייצא/י גיבוי ופנה/י מקום","err"); }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ if(syncEnabled()&&fdoc&&!applyingRemote) pushCloud(); },400); // debounced cloud push
}
const alive = c => db[c].filter(x=>!x._deleted);
const leadById = id => db.leads.find(l=>l.id===id);
const workerById = id => db.workers.find(w=>w.id===id);
const me=()=>localStorage.getItem("ogenUser")||(db.staff[0]&&db.staff[0].name)||"דביר בנגי"; // current placement manager
const firstName=n=>String(n||"").trim().split(/\s+/)[0];

/* ---------- seed demo data ---------- */
function seed(){
  if(db.leads.length||db.workers.length) return;

/* ============================================================
   MATCHING ENGINE — scoreMatch (spec א4)
   ============================================================ */
function scoreMatch(lead, worker){
  // --- hard rejections → null ---
  if(lead.gender && worker.gender && lead.gender!==worker.gender) return null;
  if(lead.needsHoist==="yes" && worker.canHoist==="no") return null;
  if(lead.needsDiapers==="yes" && worker.canDiapers==="no") return null;
  if(lead.hasDementia==="yes" && worker.knowsDementia==="no") return null;
  // --- soft scoring ---
  let score=0; const reasons=[];
  const W=(typeof LEARNED!=="undefined"&&LEARNED.weights)||{}; // learned multipliers (מנוע למידה)
  const add=(pts,label,key)=>{const p=Math.round(pts*(key&&W[key]!=null?W[key]:1));score+=p;reasons.push({pts:p,label});};
  if(lead.gender && worker.gender && lead.gender===worker.gender) add(30,"מין תואם","sameGender");
  if(lead.city && worker.city && (worker.city.includes(lead.city)||lead.city.includes(worker.city))) add(40,"אותו אזור/עיר","sameCity");
  if(worker.languages && lead.requirements){
    const langs=worker.languages.split(/[,،\s]+/).filter(Boolean);
    if(langs.some(l=>lead.requirements.includes(l))) add(15,"שפה נדרשת","langMatch");
  }
  if(lead.offeredSalary && worker.expectedSalary){
    const gap=Math.abs(Number(lead.offeredSalary)-Number(worker.expectedSalary));
    if(gap===0) add(25,"שכר זהה","salaryMatch");
    else if(gap<=300) add(22,"שכר קרוב מאוד","salaryMatch");
    else if(gap<=800) add(18,"שכר תואם","salaryMatch");
    else if(gap<=1500) add(5,"פער שכר סביר","salaryMatch");
  }
  if(lead.needsHoist==="yes" && worker.canHoist==="yes") add(25,"מתאים למנוף","hoistMatch");
  if(lead.hasDementia==="yes" && worker.knowsDementia==="yes") add(25,"ניסיון בדמנציה","dementiaMatch");
  if(lead.needsDiapers==="yes" && worker.canDiapers==="yes") add(15,"מתאים לחיתולים","diapersMatch");
  if(worker.status==="זמין") add(10,"זמין/ה כעת","available");
  return {score,reasons};
}
function explainRejection(lead, worker){
  const r=[];
  if(lead.gender && worker.gender && lead.gender!==worker.gender) r.push("אי-התאמת מין");
  if(lead.needsHoist==="yes" && worker.canHoist==="no") r.push("לא מבצע/ת הרמה במנוף");
  if(lead.needsDiapers==="yes" && worker.canDiapers==="no") r.push("לא מטפל/ת בחיתולים");
  if(lead.hasDementia==="yes" && worker.knowsDementia==="no") r.push("אין ניסיון בדמנציה");
  return r;
}
function rankMatches(lead){
  const ok=[], no=[];
  for(const w of alive("workers")){
    if(w.status==="מוצב"||w.status==="לא רלוונטי") continue;
    const m=scoreMatch(lead,w);
    if(m===null) no.push({worker:w,reasons:explainRejection(lead,w)});
    else ok.push({worker:w,...m});
  }
  ok.sort((a,b)=>b.score-a.score);
  return {ok,no};
}

/* ============================================================
   predictSuccess (spec א5)
   ============================================================ */
function predictSuccess(lead){
  const closed=alive("leads").filter(l=>l.status==="סגור-הצלחה"||l.status==="סגור-כישלון");
  if(closed.length<5) return null; // need history
  const wins=closed.filter(l=>l.status==="סגור-הצלחה").length;
  let p=wins/closed.length; const factors=[];
  // source factor
  const bySrc=closed.filter(l=>l.source===lead.source);
  if(bySrc.length>=3){const sr=bySrc.filter(l=>l.status==="סגור-הצלחה").length/bySrc.length;
    p=(p+sr)/2; factors.push(`מקור "${lead.source}": ${Math.round(sr*100)}%`);}
  // rep factor
  const byRep=closed.filter(l=>l.assignedTo===lead.assignedTo);
  if(byRep.length>=3){const rr=byRep.filter(l=>l.status==="סגור-הצלחה").length/byRep.length;
    p=(p+rr)/2; factors.push(`נציג ${lead.assignedTo}: ${Math.round(rr*100)}%`);}
  // activity bonus
  if((lead.activities||[]).length>=3){p+=.08; factors.push("3+ פעילויות מתועדות");}
  // offer bonus
  if((lead.proposedWorkerIds||[]).length){p+=.1; factors.push("הוצעו מועמדים");}
  // stuck penalty
  const last=lead.activities&&lead.activities.length? lead.activities[lead.activities.length-1].at : lead.date;
  const d=daysSince(last);
  if(d>=14){p-=.15; factors.push("14+ ימים ללא פעילות");}
  else if(d>=7){p-=.08; factors.push("7+ ימים ללא פעילות");}
  p=Math.max(.05,Math.min(.95,p));
  const pct=Math.round(p*100);
  const level=pct>=60?"high":pct>=35?"medium":"low";
  return {pct,level,factors};
}

/* ============================================================
   מנוע למידה / זיכרון — learns from every placement outcome (spec ב4·ב11)
   ============================================================ */
const FACTOR_LABELS={sameGender:"התאמת מין",sameCity:"אותו אזור",langMatch:"התאמת שפה",salaryMatch:"התאמת שכר",
  hoistMatch:"התאמת מנוף",dementiaMatch:"ניסיון בדמנציה",diapersMatch:"טיפול אישי",available:"זמינות"};
let LEARNED={n:0,base:0,weights:{},insights:[],accuracy:null};
function factorsOf(lead,worker){
  const gap=lead.offeredSalary&&worker.expectedSalary?Math.abs(+lead.offeredSalary-+worker.expectedSalary):9999;
  return {
    sameGender:!!(lead.gender&&worker.gender&&lead.gender===worker.gender),
    sameCity:!!(lead.city&&worker.city&&(worker.city.includes(lead.city)||lead.city.includes(worker.city))),
    langMatch:!!(worker.languages&&lead.requirements&&worker.languages.split(/[,\s]+/).some(l=>l&&lead.requirements.includes(l))),
    salaryMatch:gap<=800, hoistMatch:lead.needsHoist==="yes"&&worker.canHoist==="yes",
    dementiaMatch:lead.hasDementia==="yes"&&worker.knowsDementia==="yes",
    diapersMatch:lead.needsDiapers==="yes"&&worker.canDiapers==="yes", available:worker.status==="זמין",
  };
}
function recordOutcome(lead,worker,result,reason){
  db.outcomes=db.outcomes||[];
  const m=scoreMatch(lead,worker||{});
  db.outcomes.push({id:uid("out"),leadId:lead.id||"",cgId:worker?worker.id:"",factors:factorsOf(lead,worker||{}),
    score:m?m.score:0,result,reason:clean(reason||"",200),source:lead.source||"",rep:lead.assignedTo||"",at:now()});
  if(db.outcomes.length>2000)db.outcomes=db.outcomes.slice(-2000);
  computeLearning();
}
function recordOutcomeFromLead(l){
  db.outcomes=db.outcomes||[];
  if(db.outcomes.some(o=>o.leadId===l.id))return; // once per lead
  const w=(l.proposedWorkerIds&&l.proposedWorkerIds.length)?workerById(l.proposedWorkerIds[0]):null;
  if(!w)return; // need the proposed caregiver to learn feature→outcome
  recordOutcome(l,w,l.status==="סגור-הצלחה"?"success":"fail",l.lostReason||"");
}
function computeLearning(){
  const O=(db.outcomes||[]); const n=O.length;
  const base=n?O.filter(o=>o.result==="success").length/n:0;
  const weights={}, insights=[];
  Object.keys(FACTOR_LABELS).forEach(k=>{
    const wf=O.filter(o=>o.factors&&o.factors[k]), nf=O.filter(o=>!(o.factors&&o.factors[k]));
    const sWith=wf.length?wf.filter(o=>o.result==="success").length/wf.length:base;
    const sWo=nf.length?nf.filter(o=>o.result==="success").length/nf.length:base;
    const lift=sWith-sWo;
    weights[k]=Math.max(.5,Math.min(1.7,1+lift*1.6)); // learned multiplier for scoreMatch
    if(wf.length>=3)insights.push({k,label:FACTOR_LABELS[k],sWith,sWo,lift,weight:weights[k],cnt:wf.length});
  });
  insights.sort((a,b)=>b.lift-a.lift);
  let accuracy=null;
  if(n>=8){const s=O.slice().sort((a,b)=>b.score-a.score);const top=s.slice(0,Math.ceil(n/2));
    accuracy=Math.round(top.filter(o=>o.result==="success").length/top.length*100);}
  LEARNED={n,base,weights,insights,accuracy};
  return LEARNED;
}
function seedLearningHistory(){
  db.outcomes=[]; const R=Math.random;
  for(let i=0;i<28;i++){
    const f={sameGender:R()<.6,sameCity:R()<.5,langMatch:R()<.5,salaryMatch:R()<.55,
      hoistMatch:R()<.3,dementiaMatch:R()<.3,diapersMatch:R()<.35,available:R()<.8};
    const p=.26+(f.salaryMatch?.34:0)+(f.sameCity?.22:0)+(f.available?.12:0)+(f.dementiaMatch?.06:0)+(f.sameGender?.03:0);
    const result=R()<Math.min(.95,p)?"success":"fail";
    let score=0;const A={sameGender:30,sameCity:40,langMatch:15,salaryMatch:20,hoistMatch:25,dementiaMatch:25,diapersMatch:15,available:10};
    Object.keys(A).forEach(k=>{if(f[k])score+=A[k];});
    db.outcomes.push({id:uid("out"),leadId:"",cgId:"",factors:f,score,result,reason:"",
      source:["המלצה","פייסבוק","גוגל"][i%3],rep:db.staff[i%db.staff.length].name,at:now()-i*3*864e5});
  }
  computeLearning(); save(); toast("נטענה היסטוריית למידה לדוגמה","ok"); render();
}

function briefText(open,hot,avail,follow,won,urg){
  const parts=[];
  parts.push(`יש לך <b>${open.length}</b> לידים פתוחים${hot.length?`, מתוכם <b>${hot.length}</b> חמים`:""}.`);
  if(follow.length) parts.push(`<b>${follow.length}</b> מעקבים מתוזמנים להיום.`);
  parts.push(`במאגר <b>${avail.length}</b> מטפלים זמינים להצעה.`);
  if(urg.length) parts.push(`⚠️ <b>${urg.length}</b> פריטים דורשים תשומת לב — ראה/י דחיפויות.`);
  parts.push(`מתחילת החודש נסגרו <b>${won}</b> השמות בהצלחה. המשך/י כך!`);
  return parts.join(" ");
}
function pipelineBars(leads){
  const counts=LEAD_ST.map(s=>({s,n:leads.filter(l=>l.status===s).length}));
  const max=Math.max(1,...counts.map(c=>c.n));
  return counts.map(c=>`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:9px">
      <span class="st ${stClass[c.s]}" style="min-width:96px;justify-content:center"><span class="dot"></span>${c.s}</span>
      <div class="bar" style="flex:1"><i style="width:${c.n/max*100}%"></i></div>
      <b class="num" style="min-width:24px;text-align:end;color:var(--sea-950)">${c.n}</b>
    </div>`).join("");
}

function renderLeadsBody(){

function leadCard(l){

  return `<div class="lc" onclick="openLead('${l.id}')">

function kanban(ls){
  return `<div class="kanban">${LEAD_ST.map(s=>{
    const col=ls.filter(l=>l.status===s);
    return `<div class="kcol" data-status="${esc(s)}">
      <div class="khd"><span class="st ${stClass[s]}" style="padding:0 8px"><span class="dot"></span>${s}</span><span class="cnt num">${col.length}</span></div>
      ${col.map(l=>{const pred=predictSuccess(l);return `<div class="kcard" draggable="true" data-id="${l.id}" onclick="openLead('${l.id}')">
        <h5>${esc(l.patientName)} ${esc(l.patientLastName)}</h5>
        <div class="kmeta">
          <span class="temp ${l.temperature}"><span class="dot"></span></span>
          <span>${esc(l.city||"—")}</span>
          ${pred?`<span class="pred ${pred.level}" style="height:19px;padding:0 6px;margin-inline-start:auto">${pred.pct}%</span>`:""}
        </div></div>`;}).join("")}
    </div>`;}).join("")}</div>`;
}
function wireKanban(){
  let dragId=null;
  $$(".kcard").forEach(c=>{
    c.ondragstart=e=>{dragId=c.dataset.id;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";};
    c.ondragend=()=>{c.classList.remove("dragging");$$(".kcol").forEach(k=>k.classList.remove("drag-over"));};
  });
  $$(".kcol").forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add("drag-over");};
    col.ondragleave=()=>col.classList.remove("drag-over");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("drag-over");
      const l=leadById(dragId); if(l&&l.status!==col.dataset.status){
        const from=l.status; l.status=col.dataset.status;
        logActivity(l,`סטטוס שונה: ${from} → ${l.status}`);
        if(l.status.startsWith("סגור"))recordOutcomeFromLead(l); // feed the learning engine
        stamp(l); save(); renderLeadsBody(); renderNav();
        toast(`עודכן ל"${l.status}"`,"ok");
      }};
  });
}

  const l = id? leadById(id) : newLead();

  const body=()=>{
    if(modalTab==="details") return leadForm(l);
    if(modalTab==="activity") return activityPanel(l,"lead");
    if(modalTab==="match") return miniMatchPanel(l);
  };
  openModal({
    title: isNew?"ליד חדש":`${esc(l.patientName)} ${esc(l.patientLastName)}`,
    icon: I.leads,
    tabs: isNew?null:[["details","פרטים"],["activity",`יומן (${(l.activities||[]).length})`],["match","התאמות"]],
    onTab:t=>{modalTab=t;refreshModal(body(),onMount);},
    body: body(),
    footer: isNew
      ? `<button class="btn ghost" onclick="closeModal()">ביטול</button><div class="spacer"></div>
         <button class="btn primary" id="saveLead">${svg(I.check,16)}צור ליד</button>`

         ${hasAI()?`<button class="btn sm" onclick="aiLeadSummary('${l.id}')">${svg(I.brain,15)}סיכום AI</button>`:""}

         <button class="btn primary" id="saveLead">${svg(I.check,16)}שמור</button>`,
    onMount
  });
  function onMount(){
    const s=$("#saveLead"); if(s) s.onclick=()=>{ collectLead(l); if(isNew){db.leads.push(l);} stamp(l);

function openWorker(id){
  const w=id?workerById(id):newWorker(); const isNew=!id; modalTab="details";
  const body=()=>modalTab==="activity"?activityPanel(w,"worker"):workerForm(w);
  openModal({
    title:isNew?"מטפל/ת חדש/ה":`${esc(w.name)} ${esc(w.lastName)}`, icon:I.workers,
    tabs:isNew?null:[["details","פרטים"],["activity",`יומן (${(w.activities||[]).length})`],["interview","ראיון"]],
    onTab:t=>{ if(t==="interview"){renderInterviewView(w);return;} modalTab=t;refreshModal(body(),onMount);},
    body:body(),
    footer:isNew
      ?`<button class="btn ghost" onclick="closeModal()">ביטול</button><div class="spacer"></div><button class="btn primary" id="saveW">${svg(I.check,16)}צור</button>`
      :`<button class="btn danger sm" onclick="delItem('worker','${w.id}')">${svg(I.trash,15)}מחק</button><div class="spacer"></div>
        ${w.phone?`<a class="btn sm" href="https://wa.me/${w.phone.replace(/\D/g,"").replace(/^0/,"972")}" target="_blank">${svg(I.chat,15)}וואטסאפ</a>`:""}
        <button class="btn primary" id="saveW">${svg(I.check,16)}שמור</button>`,
    onMount
  });
  function onMount(){const s=$("#saveW");if(s)s.onclick=()=>{collectWorker(w);if(isNew)db.workers.push(w);save();closeModal();toast(isNew?"נוצר":"נשמר","ok");render();};}
  function renderInterviewView(w){
    refreshModal(w.interview&&w.interview.messages?`
      <div style="padding:2px">
        <div class="chip" style="margin-bottom:12px">${svg(I.chat,13)} ראיון ${w.interview.language||""} · ${w.interview.completedAt?"הושלם "+fmtDate(w.interview.completedAt):"חלקי"}</div>
        <div style="background:var(--mist);border-radius:12px;padding:12px;max-height:360px;overflow:auto">
          ${w.interview.messages.map(m=>`<div style="margin-bottom:8px"><b style="font-size:11px;color:var(--ink-3)">${m.role==="assistant"?"מאור":"מטפל/ת"}:</b>
            <div style="font-size:13.5px">${esc(m.content)}</div></div>`).join("")}
        </div></div>`
      :`<div class="empty">${svg(I.chat,44)}<h3>לא נערך ראיון AI</h3><p>המטפל/ת נוצר/ה ידנית או ללא ראיון</p></div>`,()=>{});
  }
}

function collectWorker(w){
  const f=$("#workerForm");if(!f)return;const g=n=>f.elements[n]?f.elements[n].value:w[n];
  ["name","lastName","nationality","gender","phone","city","street","languages","canHoist","canDiapers","knowsDementia",
   "status","source","notes"].forEach(n=>w[n]=clean(g(n),n==="notes"?1000:120));
  w.age=cleanInt(g("age"),0,99); w.experience=cleanInt(g("experience"),0,80); w.expectedSalary=cleanInt(g("expectedSalary"),0,50000);
  w.tags=g("tags").split(",").map(t=>clean(t,30)).filter(Boolean);
}

function scoreRing(score){
  const pct=Math.min(100,Math.round(score/1.8)); const r=30,c=2*Math.PI*r,off=c-(pct/100)*c;
  return `<div class="ring"><svg viewBox="0 0 74 74">
    <circle class="rbg" cx="37" cy="37" r="${r}"/>
    <circle class="rfg" cx="37" cy="37" r="${r}" style="stroke-dasharray:${c};stroke-dashoffset:${off}"/></svg>
    <div class="rval"><b>${score}</b><span>ניקוד</span></div></div>`;
}
function matchCard(l,m){
  const w=m.worker; const proposed=(l.proposedWorkerIds||[]).includes(w.id);
  return `<div class="mcard">
    <div class="mtop">
      ${scoreRing(m.score)}
      <div class="mnm"><h4>${esc(w.name)} ${esc(w.lastName)}</h4>
        <div class="msub">${esc(w.nationality)} · בן/בת ${esc(w.age||"?")} · ${esc(w.city)}</div></div>
    </div>
    <div class="mbody">
      <div class="reasons">
        ${m.reasons.map(r=>`<div class="reason plus">${svg(I.check,15)}<span>${esc(r.label)}</span><b style="margin-inline-start:auto">+${r.pts}</b></div>`).join("")}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
        <span class="chip">${esc(w.languages||"—")}</span>
        <span class="chip">${money(w.expectedSalary)}</span>
        <span class="st ${stClass[w.status]}"><span class="dot"></span>${w.status}</span>
      </div>
      <div class="mact">
        <button class="btn ${proposed?"":"primary"}" ${proposed?"disabled":""} onclick="proposeWorker('${l.id}','${w.id}')">
          ${proposed?"הוצע ✓":svg(I.send,15)+"הצע למשפחה"}</button>
        <button class="btn icon" onclick="openWorker('${w.id}')">${svg(I.edit,16)}</button>
      </div>
    </div>
  </div>`;
}
function rejectCard(n){
  const w=n.worker;
  return `<div class="mcard rejected">
    <div class="mtop" style="background:linear-gradient(160deg,#7a3b3b,#5a2a2a)">
      <div class="ring"><svg viewBox="0 0 74 74"><circle class="rbg" cx="37" cy="37" r="30"/></svg>
        <div class="rval">${svg(I.x,26)}</div></div>
      <div class="mnm"><h4>${esc(w.name)} ${esc(w.lastName)}</h4><div class="msub">${esc(w.nationality)} · ${esc(w.city)}</div></div>
    </div>
    <div class="mbody">
      <div class="rej-list"><div style="font-weight:700;color:var(--danger);font-size:12px;margin-bottom:6px">סיבות דחייה (חוק הזהב):</div>
        ${n.reasons.map(r=>`<div class="reason">${svg(I.x,14)}<span>${esc(r)}</span></div>`).join("")}</div>
    </div>
  </div>`;
}
function proposeWorker(leadId,workerId){
  const l=leadById(leadId),w=workerById(workerId); if(!l||!w)return;
  l.proposedWorkerIds=l.proposedWorkerIds||[]; if(!l.proposedWorkerIds.includes(workerId))l.proposedWorkerIds.push(workerId);
  if(l.status==="חדש"||l.status==="בטיפול")l.status="הוצע עובד";
  logActivity(l,`הוצע/ה ${w.name} ${w.lastName} (ניקוד ${scoreMatch(l,w)?.score||"—"})`);
  stamp(l); save();
  toast(`${w.name} הוצע/ה למשפחת ${l.patientLastName}`,"ok");
  if(state.tab==="match")renderMatch($("#view")); renderNav();
}

let hiburFamCache=[], hiburCgCache=[];
async function loadHiburList(){
  const fdb2=initHiburRead(); if(!fdb2)return;
  try{
    const [famSnap,cgSnap]=await Promise.all([fdb2.collection("hibur").get(),fdb2.collection("hibur_cg").get()]);
    hiburFamCache=famSnap.docs.map(d=>Object.assign({_id:d.id},d.data()));
    hiburCgCache=cgSnap.docs.map(d=>Object.assign({_id:d.id},d.data()));
    renderHiburListBody();
  }catch(e){console.warn("hibur list",e);}
}
function renderHiburListBody(){
  const box=$("#hiburList"); if(!box)return;
  const view=state.hiburView||"fam";
  const q=(state.hiburSearch||"").trim();
  let rows=view==="fam"?hiburFamCache:hiburCgCache;
  if(q)rows=rows.filter(r=>[r.name,r.city,r.phone].join(" ").includes(q));
  if(!rows.length){box.innerHTML=`<div class="empty" style="padding:24px">${svg(I.workers,36)}<h3>${view==="fam"?"אין משפחות רשומות":"אין מטפלים רשומים"}</h3></div>`;return;}
  box.innerHTML=`<table class="tbl"><thead><tr>
      <th>שם</th><th>עיר</th><th>טלפון</th>${view==="cg"?"<th>לאום</th><th>ניסיון</th><th>סטטוס</th><th>Trust Score</th>":"<th>תקציב</th><th>נרשמ/ה</th>"}
    </tr></thead><tbody>
    ${rows.map(r=>view==="fam"?`<tr>
        <td><b>${esc(r.name||"—")}</b></td><td>${esc(r.city||"—")}</td><td dir="ltr" style="text-align:right">${esc(r.phone||"—")}</td>
        <td>${money((r.family&&r.family.offeredSalary)||0)}</td><td>${fmtDate(r.createdAt?new Date(r.createdAt).toISOString():"")}</td>
      </tr>`:`<tr>
        <td><b>${esc(r.name||"—")}</b></td><td>${esc(r.city||"—")}</td><td dir="ltr" style="text-align:right">${esc(r.phone||"—")}</td>
        <td>${esc(r.nationality||"—")}</td><td>${esc(r.experience||"—")}</td>
        <td><span class="st ${r.status==="זמין"?"w-avail":"w-proc"}"><span class="dot"></span>${esc(r.status||"—")}</span></td>
        <td>${trustScoreBadge(r)}</td>
      </tr>`).join("")}
  </tbody></table>`;
}
function computeTrustScore(w){
  let s=0;
  if(w.idDocCheck&&w.idDocCheck.ok)s+=30;
  if(w.photo)s+=20;
  if(w.video)s+=20;
  if(w.about||w.bio)s+=15;
  if(w.languages)s+=5;
  if(w.experience)s+=5;
  if(w.phone)s+=5;
  return s;
}
function trustScoreBadge(w){
  const s=computeTrustScore(w);
  const color=s>=70?"var(--ok)":s>=40?"var(--warn)":"var(--danger)";
  const bg=s>=70?"var(--ok-soft)":s>=40?"var(--warn-soft)":"var(--danger-soft)";
  return `<span class="chip" style="background:${bg};color:${color};font-weight:800">${s}/100</span>`;
}

/* ---------- tiny QR (module drawing, no external lib needed for preview) ---------- */
function drawQR(box,text){
  // lightweight visual QR-like matrix (deterministic from text) — real qrcodejs would go here
  const n=25; let h=0; for(const c of text)h=(h*31+c.charCodeAt(0))>>>0;
  const rand=()=>{h=(h*1103515245+12345)&0x7fffffff;return h/0x7fffffff;};
  let cells="";
  const finder=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const on=i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4);
    if(on)cells+=`<rect x="${x+j}" y="${y+i}" width="1" height="1"/>`;}};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9))continue;
    if(rand()>.55)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  finder(0,0);finder(n-7,0);finder(0,n-7);
  box.innerHTML=`<svg viewBox="0 0 ${n} ${n}" fill="var(--sea-950)" shape-rendering="crispEdges">${cells}</svg>`;
}

/* ---------- Hebrew smart search (spec א8) ---------- */
function smartSearchLeads(ls,q){
  q=q.trim(); let out=ls;
  if(/חמ|דחוף/.test(q))out=out.filter(l=>l.temperature==="hot");
  if(/פושר/.test(q))out=out.filter(l=>l.temperature==="warm");
  if(/קר/.test(q))out=out.filter(l=>l.temperature==="cold");
  if(/פתוח/.test(q))out=out.filter(l=>!l.status.startsWith("סגור"));
  if(/סגור|נסגר/.test(q))out=out.filter(l=>l.status.startsWith("סגור"));
  if(/תקוע|פיגור|באיחור/.test(q))out=out.filter(l=>{const last=l.activities&&l.activities.length?l.activities[l.activities.length-1].at:l.date;return daysSince(last)>=7&&!l.status.startsWith("סגור");});
  if(/מנוף/.test(q))out=out.filter(l=>l.needsHoist==="yes");
  if(/דמנצי|אלצהיימר/.test(q))out=out.filter(l=>l.hasDementia==="yes");
  db.staff.forEach(u=>{if(q.includes(u.name.split(" ")[0]))out=out.filter(l=>l.assignedTo===u.name);});
  // free text
  const words=q.replace(/לידים|של|עם|צריך|צריכים/g,"").trim();
  if(words&&out.length===ls.length){
    out=ls.filter(l=>[l.patientName,l.patientLastName,l.city,l.contactName,l.contactPhone,(l.tags||[]).join(" "),l.requirements].join(" ").includes(words));
  }else if(words){
    const t=out.filter(l=>[l.patientName,l.patientLastName,l.city,l.contactName].join(" ").includes(words));
    if(t.length)out=t;
  }
  return out;
}
function smartSearchWorkers(ws,q){
  q=q.trim();let out=ws;
  if(/זמינ/.test(q))out=out.filter(w=>w.status==="זמין");
  if(/גבר|זכר/.test(q))out=out.filter(w=>w.gender==="male");
  if(/אישה|נקבה|מטפלת/.test(q))out=out.filter(w=>w.gender==="female");
  if(/מנוף/.test(q))out=out.filter(w=>w.canHoist==="yes");
  if(/דמנצי/.test(q))out=out.filter(w=>w.knowsDementia==="yes");
  const words=q.replace(/מטפל|מטפלת|מטפלים|זמינ\w*/g,"").trim();
  if(words){const t=out.filter(w=>[w.name,w.lastName,w.city,w.nationality,w.languages,(w.tags||[]).join(" ")].join(" ").includes(words));if(t.length||out.length===ws.length)out=t.length?t:out;}
  return out;
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  dl(blob,`ogen-crm-גיבוי-${new Date().toISOString().slice(0,10)}.json`); toast("גיבוי יוצא","ok");
  localStorage.setItem("ogenLastBackup",String(Date.now()));
}
function checkBackupReminder(){ // spec א7: weekly backup reminder
  const last=+(localStorage.getItem("ogenLastBackup")||0);
  const days=last?Math.floor((Date.now()-last)/864e5):999;
  if(days>=7) setTimeout(()=>toast(last?`עברו ${days} ימים מהגיבוי האחרון — מומלץ לייצא גיבוי (הגדרות)`:"טרם בוצע גיבוי — מומלץ לייצא אחד (הגדרות)","err"),1200);
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);["leads","workers","matches","staff","templates"].forEach(c=>{if(Array.isArray(d[c]))db[c]=d[c];});
    sanitizeDb(db);save();toast("שוחזר בהצלחה","ok");render();renderNav();}catch(err){toast("קובץ לא תקין","err");}};
  r.readAsText(f);
}
function exportExcel(){ // CSV (Excel-friendly, spec ייצוא)
  const rows=[["שם","עיר","גיל","סטטוס","רכז","שכר","טמפ׳","טלפון"]];
  alive("leads").forEach(l=>rows.push([l.patientName+" "+l.patientLastName,l.city,l.patientAge,l.status,l.assignedTo,l.offeredSalary,l.temperature,l.contactPhone]));
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  dl(new Blob([csv],{type:"text/csv"}),"ogen-לידים.csv"); toast("יוצא ל-CSV","ok");
}
function exportICS(){
  let ics="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//ogen//crm//HE\n";
  alive("leads").filter(l=>l.followUpDate).forEach(l=>{
    const d=new Date(l.followUpDate).toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    ics+=`BEGIN:VEVENT\nDTSTART:${d}\nSUMMARY:מעקב — ${l.patientName} ${l.patientLastName}\nDESCRIPTION:${l.city} · ${l.assignedTo}\nEND:VEVENT\n`;});
  ics+="END:VCALENDAR"; dl(new Blob([ics],{type:"text/calendar"}),"ogen-מעקבים.ics"); toast("יומן יוצא","ok");
}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function wipeAll(){if(confirm("לאפס את כל הנתונים? פעולה בלתי-הפיכה."))
  {localStorage.removeItem(LS_KEY);db={leads:[],workers:[],matches:[],staff:[],templates:[]};load();save();toast("המערכת אופסה","ok");render();renderNav();}}
function reseed(){db={leads:[],workers:[],matches:[],staff:[],templates:[]};load();seed();toast("נתוני דמו נטענו","ok");render();renderNav();}
function addStaff(){
  const name=clean($("#newStaffName").value,60), role=clean($("#newStaffRole").value,40)||"רכז/ת";
  const code=clean($("#newStaffCode").value,40);
  if(!name){toast("הזן/י שם","err");return;}
  if(db.staff.some(s=>s.name===name)){toast("שם כבר קיים","err");return;}
  if(code&&db.staff.some(s=>s.code===code)){toast("קוד כבר בשימוש","err");return;}
  db.staff.push({id:uid("u"),name,role,code:code||undefined}); save(); toast("נוסף: "+name,"ok"); render();
}
function removeStaff(id){
  if(db.staff.length<=1){toast("חייב להישאר מנהל אחד לפחות","err");return;}
  const u=db.staff.find(x=>x.id===id); db.staff=db.staff.filter(x=>x.id!==id);
  if(u&&me()===u.name){localStorage.setItem("ogenUser",db.staff[0].name);}
  save(); toast("הוסר","ok"); render(); renderNav();

let ivState=null;
function launchInterview(){
  $("#interview").classList.add("on");
  $("#ivBody").innerHTML=`<div class="iv-lang">${Object.keys(IV_LANGS).map(l=>`<button data-lang="${l}">${l}</button>`).join("")}</div>`;
  $$("#ivBody [data-lang]").forEach(b=>b.onclick=()=>beginInterview(b.dataset.lang));
}
function beginInterview(lang){
  const L=IV_LANGS[lang];
  ivState={lang,code:L.code,idx:-1,answers:{},messages:[],mode:hasAI()?"ai":"script",system:aiInterviewSystem(lang)};
  $("#ivBody").innerHTML="";$("#ivFoot").style.display="flex";
  ivBotSay(L.greet,()=>{ivState.idx=0;});
  $("#ivSend").onclick=ivSubmit; $("#ivInput").onkeydown=e=>{if(e.key==="Enter")ivSubmit();};
  $("#ivInput").focus();
}
function ivBubble(role,text){
  const b=document.createElement("div");b.className="bub "+(role==="assistant"?"them":"me");
  b.innerHTML=esc(text)+`<time>${new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}</time>`;
  $("#ivBody").appendChild(b);$("#ivBody").scrollTop=$("#ivBody").scrollHeight;
  ivState.messages.push({role,content:text});
}
function ivTyping(on){
  let t=$("#ivTyping");
  if(on&&!t){t=document.createElement("div");t.id="ivTyping";t.className="typing";t.innerHTML="<i></i><i></i><i></i>";
    $("#ivBody").appendChild(t);$("#ivBody").scrollTop=$("#ivBody").scrollHeight;}
  else if(!on&&t)t.remove();
}
function ivBotSay(text,cb){ivTyping(true);$("#ivStatus").textContent="מקלידה…";
  setTimeout(()=>{ivTyping(false);$("#ivStatus").textContent="מקוונת";ivBubble("assistant",text);if(cb)cb();},700+Math.random()*500);}
function ivSubmit(){
  const inp=$("#ivInput");const val=inp.value.trim();if(!val||ivState.idx<0)return;
  inp.value="";ivBubble("user",val);
  if(ivState.mode==="ai"){ivSubmitAI();return;}
  const cur=IV_QUESTIONS[ivState.idx];
  if(cur)ivState.answers[cur.key]=val;
  ivState.idx++;
  // resilient partial save after 3 & 6 answers (spec)
  const answered=Object.keys(ivState.answers).length;
  if(answered===3||answered===6)partialSaveInterview();
  if(ivState.idx>=IV_QUESTIONS.length){finishInterview();return;}
  const nextQ=IV_QUESTIONS[ivState.idx].q[ivState.code]||IV_QUESTIONS[ivState.idx].q.en;
  const ack=answered===1?"":IV_LANGS[ivState.lang].thanks+" ";
  ivBotSay(ack+nextQ);
}
async function ivSubmitAI(){
  ivTyping(true);$("#ivStatus").textContent="מקלידה…";
  let reply;
  try{ reply=await callAI(ivState.messages,ivState.system); }
  catch(e){ // graceful fallback → scripted question
    ivTyping(false);$("#ivStatus").textContent="מקוונת"; ivState.mode="script";
    ivState.idx=Math.min(Object.keys(ivState.answers).length,IV_QUESTIONS.length-1);
    ivBubble("assistant",IV_QUESTIONS[ivState.idx].q[ivState.code]||IV_QUESTIONS[ivState.idx].q.en); return; }
  ivTyping(false);$("#ivStatus").textContent="מקוונת";
  const done=/\[DONE\]/i.test(reply);
  const shown=reply.replace(/\[DONE\][\s\S]*$/i,"").trim();
  if(shown)ivBubble("assistant",shown);
  if(done){
    const m=reply.match(/\{[\s\S]*\}/);
    if(m){try{ivState.answers=Object.assign({},ivState.answers,JSON.parse(m[0]));}catch(e){}}
    finishInterview();
  }
}
function partialSaveInterview(){
  // save/update a partial worker so a dropped candidate isn't lost
  let w=db.workers.find(x=>x._ivSession===ivSessionId);
  if(!w){w=buildWorkerFromInterview(true);w._ivSession=ivSessionId;db.workers.push(w);}
  else Object.assign(w,buildWorkerFromInterview(true),{id:w.id,_ivSession:ivSessionId});
  save();
}
const ivSessionId=uid("ivs");
function finishInterview(){
  const w=buildWorkerFromInterview(false);
  const existing=db.workers.find(x=>x._ivSession===ivSessionId);
  if(existing)Object.assign(existing,w,{id:existing.id});else db.workers.push(w);
  save();
  const L=IV_LANGS[ivState.lang];
  ivBotSay(L.done,()=>{
    $("#ivFoot").style.display="none";
    setTimeout(()=>{
      $("#ivBody").innerHTML+=`<div class="iv-done"><div class="v">${svg(I.check,34)}</div>
        <h2>הפרופיל נוצר ✓</h2><p>${esc(w.name)} · ${esc(w.nationality)}</p></div>`;
      $("#ivBody").scrollTop=$("#ivBody").scrollHeight;
    },400);
  });
}
function buildWorkerFromInterview(partial){ // sanitize AI/user output (spec)
  const a=ivState.answers;
  const yesNo=v=>/כן|yes|sí|si|\bda\b|\bha\b|oo|opo|بله|آره|አዎ|да/i.test(v||"")?"yes"
    :/לא|\bno\b|\bnu\b|yo'?q|hindi|نه|خیر|አይ|нет/i.test(v||"")?"no":"";
  const nameParts=clean(a.name||"מטפל/ת חדש/ה",60).split(" ");
  return {
    id:uid("wrk"),dateAdded:now(),status:"זמין",source:"ראיון AI",
    name:nameParts[0]||"", lastName:nameParts.slice(1).join(" ")||"",
    nationality:clean(a.nationality,40), gender:"", age:"", birthDate:"", maritalStatus:"",
    phone:"", city:"", street:"",
    languages:ivState.lang==="עברית"?"עברית":clean(ivState.lang,40),
    experience:cleanInt(a.experience,0,80),
    expectedSalary:cleanInt(a.salary,0,50000),
    canHoist:yesNo(a.physical), canDiapers:yesNo(a.physical), knowsDementia:yesNo(a.dementia),

   ============================================================ */
const firebaseConfig={apiKey:"AIzaSyAHFamD1InXLSe1oPFWuuBk_SroK6duVHg",authDomain:"ogen-crm.firebaseapp.com",
  projectId:"ogen-crm",storageBucket:"ogen-crm.firebasestorage.app",messagingSenderId:"111888037947",
  appId:"1:111888037947:web:00b833b907138c1309041e"};
let fdoc=null, applyingRemote=false, syncReady=false;
const syncDoc=()=>localStorage.getItem("ogenSyncDoc")||"main"; // LIVE production doc (crm/main) — shared with the team
const syncEnabled=()=>localStorage.getItem("ogenSync")!=="0"; // default ON (opt-out)
function setSyncStatus(s){
  const el=$("#syncDot"); if(!el)return;
  const map={local:["מקומי","#6E8189"],connecting:["מסנכרן…","#E0913A"],connected:["מסונכרן","#10916E"],error:["שגיאה","#D64550"]};
  const [txt,c]=map[s]||map.local;
  el.innerHTML=`<span style="width:8px;height:8px;border-radius:50%;background:${c};display:inline-block"></span>${txt}`;
  el.title="מסמך סנכרון: crm/"+syncDoc();
}
function serializableDb(){
  const c=JSON.parse(JSON.stringify({leads:db.leads,workers:db.workers,matches:db.matches,staff:db.staff,templates:db.templates}));
  c.workers.forEach(w=>{delete w._ivSession;}); c._lastUpdate=now(); return c;
}
function initFirebase(){
  if(!syncEnabled()){setSyncStatus("local");return;}
  if(typeof firebase==="undefined"){setSyncStatus("error");return;}
  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    fdoc=firebase.firestore().collection("crm").doc(syncDoc());
    syncReady=false; setSyncStatus("connecting");
    fdoc.onSnapshot({includeMetadataChanges:true},snap=>{
      if(snap.metadata.hasPendingWrites) return;              // ignore our own local echo
      const data=snap.data();
      if(data){
        applyingRemote=true;
        ["leads","workers","matches","staff","templates"].forEach(c=>{if(Array.isArray(data[c]))db[c]=data[c];});
        sanitizeDb(db);
        try{localStorage.setItem(LS_KEY,JSON.stringify(db));}catch(e){}
        applyingRemote=false;
        if($("#app") && !$("#app").classList.contains("hidden")){renderNav();render();}
      }
      syncReady=true; setSyncStatus("connected");             // only NOW is it safe to push (baseline loaded)
    },err=>{setSyncStatus("error");console.warn("sync",err);});
    fdoc.get().then(s=>{if(!s.exists){syncReady=true;pushCloud();}}).catch(()=>{}); // brand-new doc only → seed once
  }catch(e){setSyncStatus("error");console.warn(e);}
}
function pushCloud(){
  if(!fdoc||applyingRemote||!syncReady)return; // never write to prod before the remote baseline is loaded
  const payload=serializableDb(); const size=JSON.stringify(payload).length;
  if(size>950e3)toast("⚠️ בסיס הנתונים מתקרב ל-1MB — ייצא/י גיבוי","err");
  else if(size>700e3)toast("שים לב: בסיס הנתונים מעל 700KB","err");
  fdoc.set(payload).then(()=>setSyncStatus("connected")).catch(e=>{setSyncStatus("error");console.warn(e);});
}
function toggleSync(on){
  localStorage.setItem("ogenSync",on?"1":"0");
  if(on) initFirebase(); else { fdoc=null; setSyncStatus("local"); }
}

/* ============================================================
   GEMINI AI  (production parity) — key from settings only, no embedded secret
   ============================================================ */
const AI_MODEL="gemini-flash-latest";
// Two keys with automatic failover: primary → backup when primary is exhausted/blocked.
const getAIKeys=()=>["geminiApiKey","geminiApiKey2"].map(k=>(localStorage.getItem(k)||"").trim()).filter(Boolean);
const getAIKey=()=>getAIKeys()[0]||"";            // back-compat
const hasAI=()=>getAIKeys().length>0;
const AI_URL=(m,key)=>"https://generativelanguage.googleapis.com/v1beta/models/"+(m||AI_MODEL)+":generateContent?key="+encodeURIComponent(key);
const geminiText=d=>((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
const AI_FAILOVER=[429,403,400,500,503];          // quota/exhausted/blocked/temporary → try next key
async function callAI(messages,system){
  const keys=getAIKeys(); if(!keys.length)throw new Error("no-key");
  let msgs=messages.slice(); while(msgs.length&&msgs[0].role==="assistant") msgs.shift(); // Gemini: contents must start with a user turn
  const body={contents:msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}))};
  if(system)body.systemInstruction={parts:[{text:system}]};
  let lastErr=null;
  for(let i=0;i<keys.length;i++){
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),60000);
    try{
      const r=await fetch(AI_URL(null,keys[i]),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
      clearTimeout(to);
      if(r.ok) return geminiText(await r.json()).trim();
      lastErr=new Error("AI "+r.status);
      if(AI_FAILOVER.includes(r.status)){ if(i<keys.length-1) toast("מפתח "+(i+1)+" מוצה — מעבר למפתח גיבוי","err"); continue; } // next key
      throw lastErr;                               // non-quota error → don't burn the backup
    }catch(e){ clearTimeout(to); lastErr=e; }       // network/abort → try next key
  }
  throw lastErr||new Error("AI failed");
}
function aiInterviewSystem(lang){
  return `אתה "מאור", מגייס חם ומקצועי בחברת "עוגן סיעוד". נהלי ראיון קצר וטבעי בשפה: ${lang}.
ההודעה הראשונה כבר שאלה את השם המלא. אספי בהדרגה — שאלה אחת בלבד בכל הודעה — את 11 הפרטים:
שם מלא, מדינת מוצא, שנות ניסיון בטיפול, ניסיון עם קשישים, האם עבד/ה בישראל, נכונות ללינה בבית המטופל,
ציפיית שכר חודשית בשקלים, ניסיון עם אלצהיימר/דמנציה, יכולת טיפול גופני (הרמה/חיתולים), חוזקות, וסטטוס ויזה.
הגיבי בחום לפני כל שאלה הבאה. כשכל הפרטים נאספו — כתבי משפט סיום ידידותי, ואז בשורה נפרדת המילה [DONE]
ואחריה JSON תקין בלבד עם המפתחות:
{"name","nationality","experience","elderly","israel","live","salary","dementia","physical","strengths","visa"}.`;
}
async function aiLeadSummary(leadId){
  const l=leadById(leadId); if(!l)return;
  toast("מכין סיכום AI…","ok");
  const facts=`מטופל: ${l.patientName} ${l.patientLastName}, גיל ${l.patientAge}, ${l.city}. סטטוס: ${l.status}, טמפ׳ ${l.temperature}.
צרכים: מנוף=${l.needsHoist} חיתולים=${l.needsDiapers} דמנציה=${l.hasDementia}. שכר מוצע ${l.offeredSalary}.
דרישות: ${l.requirements}. הערות: ${l.notes}. פעילויות: ${(l.activities||[]).map(a=>a.text).join("; ")}`;
  try{
    const s=await callAI([{role:"user",content:"סכם/י את הליד הבא ב-3 משפטים והצע/י צעד הבא אחד:\n"+facts}],
      "את/ה עוזר/ת לרכז/ת השמה. תשובה תמציתית בעברית.");
    openModal({title:"סיכום AI — "+esc(l.patientName),icon:I.brain,
      body:`<div style="white-space:pre-wrap;line-height:1.7;font-size:14px">${esc(s)}</div>`,
      footer:`<div class="spacer"></div><button class="btn primary" onclick="closeModal()">סגור</button>`});
  }catch(e){toast(e.message==="no-key"?"הזן/י מפתח Gemini בהגדרות":"שגיאת AI","err");}
}

   EXCEL (SheetJS) · RECYCLE BIN · CALLER ID

function exportXLSX(){
  if(typeof XLSX==="undefined"){toast("ספריית Excel לא נטענה","err");return;}
  const wb=XLSX.utils.book_new();
  const L=alive("leads").map(l=>({"שם":l.patientName+" "+l.patientLastName,"עיר":l.city,"גיל":l.patientAge,"סטטוס":l.status,
    "רכז":l.assignedTo,"שכר מוצע":l.offeredSalary,"טמפרטורה":l.temperature,"טלפון":l.contactPhone,"מקור":l.source,
    "מנוף":l.needsHoist,"דמנציה":l.hasDementia,"חיתולים":l.needsDiapers,"הערות":l.notes}));
  const W=alive("workers").map(w=>({"שם":w.name+" "+w.lastName,"לאום":w.nationality,"מין":w.gender,"גיל":w.age,"עיר":w.city,
    "טלפון":w.phone,"שפות":w.languages,"ניסיון":w.experience,"ציפיית שכר":w.expectedSalary,"סטטוס":w.status,
    "מנוף":w.canHoist,"דמנציה":w.knowsDementia,"חיתולים":w.canDiapers}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L),"לידים");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(W),"עובדים");
  XLSX.writeFile(wb,"ogen-crm-"+new Date().toISOString().slice(0,10)+".xlsx"); toast("יוצא ל-Excel","ok");
}
function importXLSXFile(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const wb=XLSX.read(r.result,{type:"binary"}); let added=0;
    wb.SheetNames.forEach(sn=>{
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn]); const isW=/עובד|מטפל/.test(sn);
      rows.forEach(row=>{ const nm=String(row["שם"]||"").split(" ");
        if(isW){const w=newWorker();w.name=clean(nm[0],60);w.lastName=clean(nm.slice(1).join(" "),60);
          w.nationality=clean(row["לאום"],40);w.city=clean(row["עיר"],60);w.phone=clean(row["טלפון"],40);
          w.languages=clean(row["שפות"],120);w.experience=cleanInt(row["ניסיון"],0,80);w.expectedSalary=cleanInt(row["ציפיית שכר"],0,50000);
          w.source="ייבוא Excel";db.workers.push(w);added++;}
        else{const l=newLead();l.patientName=clean(nm[0],60);l.patientLastName=clean(nm.slice(1).join(" "),60);
          l.city=clean(row["עיר"],60);l.patientAge=cleanInt(row["גיל"],0,130);l.contactPhone=clean(row["טלפון"],40);
          l.offeredSalary=cleanInt(row["שכר מוצע"]!=null?row["שכר מוצע"]:row["שכר"],0,50000);l.source="ייבוא Excel";db.leads.push(l);added++;}
      });
    });
    save();toast(added+" רשומות יובאו","ok");render();renderNav();
  }catch(err){toast("קובץ Excel לא תקין","err");console.warn(err);}};
  r.readAsBinaryString(f);
}
function purgeOldDeleted(){
  const cut=Date.now()-30*864e5; let n=0;
  ["leads","workers"].forEach(c=>{const before=db[c].length;
    db[c]=db[c].filter(x=>!(x._deleted&&x._deletedAt&&new Date(x._deletedAt).getTime()<cut)); n+=before-db[c].length;});
  return n;
}
function deletedItems(){return [...db.leads.filter(x=>x._deleted).map(x=>({t:"lead",x})),
  ...db.workers.filter(x=>x._deleted).map(x=>({t:"worker",x}))];}
function restoreItem(type,id){const it=type==="lead"?leadById(id):workerById(id);if(!it)return;
  it._deleted=false;delete it._deletedAt;save();toast("שוחזר","ok");render();renderNav();}
function purgeItem(type,id){const arr=type==="lead"?db.leads:db.workers;const i=arr.findIndex(x=>x.id===id);
  if(i>=0)arr.splice(i,1);save();toast("נמחק לצמיתות","ok");render();}
const normPhone=s=>String(s||"").replace(/\D/g,"").replace(/^972/,"0");
function callerId(){
  const num=prompt("הזן/י מספר טלפון לזיהוי מתקשר:");if(!num)return;
  const n=normPhone(num); if(!n){toast("מספר לא תקין","err");return;}
  const lead=alive("leads").find(l=>normPhone(l.contactPhone)===n);
  const worker=alive("workers").find(w=>normPhone(w.phone)===n);
  if(lead){toast("📞 ליד: "+lead.patientName+" "+lead.patientLastName,"ok");openLead(lead.id);}
  else if(worker){toast("📞 מטפל/ת: "+worker.name+" "+worker.lastName,"ok");openWorker(worker.id);}
  else toast("המספר אינו מזוהה במערכת","err");
}

/* ============================================================
   LOCK SCREEN
   ============================================================ */
let attempts=0,locked=false;
function initLock(){
  const inp=$("#pinInput");
  $("#pinGo").onclick=checkPin;
  inp.onkeydown=e=>{if(e.key==="Enter")checkPin();};
  inp.focus();
}
function checkPin(){
  if(locked)return;
  const inp=$("#pinInput"); const val=inp.value;
  if(!val)return;
  const su=db.staff.find(s=>s.code&&s.code===val);
  if(su){localStorage.setItem("ogenUser",su.name);unlock();}
  else{
    attempts++; inp.value=""; inp.classList.add("shake");
    setTimeout(()=>inp.classList.remove("shake"),450);
    if(attempts>=5){locked=true;lockout();}
    else $("#lockMsg").textContent=`קוד שגוי — נותרו ${5-attempts} ניסיונות`;
  }
}
function lockout(){
  let s=60;const msg=$("#lockMsg");
  const t=setInterval(()=>{msg.textContent=`ננעל לאחר 5 ניסיונות. נסה/י שוב בעוד ${s}s`;
    if(--s<0){clearInterval(t);locked=false;attempts=0;msg.textContent="";}},1000);
}
function unlock(){
  $("#lock").classList.add("hidden");$("#app").classList.remove("hidden");
  boot();
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  const u=me(); const su=db.staff.find(s=>s.name===u);
  $("#whoName").textContent=u; $("#whoAva").textContent=(u[0]||"?");
  if(su&&$("#whoRole"))$("#whoRole").textContent=su.role||"מנהל השמה";
  renderNav(); go("dash");
  setSyncStatus(syncEnabled()?"connecting":"local"); initFirebase();
  checkBackupReminder();
  $("#globalSearch").oninput=e=>{
    const q=e.target.value;
    if(state.tab==="workers"){state.workerFilter.q=q;renderWorkersBody?.();}
    else{state.leadFilter.q=q; if(state.tab!=="leads")go("leads"); else renderLeadsBody();}
  };
}
function init(){
  load();
  const params=new URLSearchParams(location.search);
  if(params.get("mode")==="interview"){ $("#lock").classList.add("hidden"); launchInterview(); return; }
  seed();
  initLock();
}
init();
